<title>Shipping With Agents</title>
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --paper:#eceeed; --surface:#f7f8f7; --sunk:#e2e5e4;
  --ink:#12181a; --ink-2:#414c50; --ink-3:#6c787c;
  --line:#cdd3d2; --line-2:#dde1e0;
  --signal:#0e6b72; --signal-soft:#d7e6e6;
  --gate:#9a5a06; --gate-soft:#f0e3cf;
  --ok:#2f6b3d; --warn:#9a3a2c;
  --shadow:0 1px 0 rgba(18,24,26,.05);
  --f-disp:'Archivo',system-ui,sans-serif;
  --f-body:'Source Serif 4',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1214; --surface:#1b2326; --sunk:#283235;
  --ink:#e6eae9; --ink-2:#bfc9c9; --ink-3:#97a5a6;
  --line:#3d4a4d; --line-2:#2f3a3d;
  --signal:#4fbfc4; --signal-soft:#16333a;
  --gate:#d59a4a; --gate-soft:#33270f;
  --ok:#67b37c; --warn:#e0836f;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0e1214; --surface:#1b2326; --sunk:#283235;
  --ink:#e6eae9; --ink-2:#bfc9c9; --ink-3:#97a5a6;
  --line:#3d4a4d; --line-2:#2f3a3d;
  --signal:#4fbfc4; --signal-soft:#16333a;
  --gate:#d59a4a; --gate-soft:#33270f;
  --ok:#67b37c; --warn:#e0836f;
  --shadow:0 1px 0 rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:15.5px;line-height:1.58;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:600;letter-spacing:-.015em;
  text-wrap:balance;margin:0;line-height:1.18}
a{color:var(--signal);text-underline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- chrome ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:0 16px}
.top-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:18px;
  flex-wrap:wrap;padding-block:9px}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.11em}
nav.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs{--fl:#000;--fr:#000;-webkit-mask-image:linear-gradient(to right,var(--fl),#000 34px,#000 calc(100% - 34px),var(--fr));
  mask-image:linear-gradient(to right,var(--fl),#000 34px,#000 calc(100% - 34px),var(--fr))}
nav.tabs.more-l{--fl:transparent}
nav.tabs.more-r{--fr:transparent}
nav.tabs button{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;background:none;border:0;color:var(--ink-3);cursor:pointer;
  padding:6px 9px;border-radius:3px;flex:none;white-space:nowrap}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--sunk);font-weight:700}
.meter-mini{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;
  color:var(--ink-3);white-space:nowrap}
.bar{height:5px;width:74px;background:var(--sunk);border-radius:0;overflow:hidden;display:flex}
.bar i{display:block;background:var(--signal);height:100%}
.theme{background:none;border:1px solid var(--line);color:var(--ink-3);cursor:pointer;
  border-radius:3px;padding:5px 6px;font-family:var(--f-mono);font-size:11px;display:flex;align-items:center}
.theme:hover,.theme[aria-expanded="true"]{color:var(--ink);border-color:var(--ink-3)}
.settings{position:relative;flex:none}
.panel{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(330px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.2)}
.panel h3{font-family:var(--f-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  color:var(--ink-3);margin:0 0 8px}
.panel h3:not(:first-child){margin-top:15px;padding-top:14px;border-top:1px solid var(--line-2)}
.panel p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 10px}
.panel .fine{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.panel .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-right:6px;
  vertical-align:1px}
.panel .dot.on{background:var(--ok)}
.panel .dot.warn{background:var(--gate)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:6px 8px;border:0;
  border-left:1px solid var(--line);background:none;color:var(--ink-3);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:700}
.status button{font:inherit;color:var(--signal);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

main{max-width:1220px;margin:0 auto;padding:0 16px;padding-block:26px 64px}
.view[hidden]{display:none!important}

/* ---- overview ---- */
.hero{border-left:3px solid var(--signal);padding-left:18px;margin-bottom:30px}
.hero h1{font-size:clamp(27px,4.4vw,42px);font-weight:700;letter-spacing:-.03em}
.hero .kicker{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--signal);margin-bottom:9px}
.hero p{max-width:62ch;color:var(--ink-2);margin:.7em 0 0}
.hero .hook{font-size:18px;line-height:1.5;color:var(--ink);max-width:58ch;margin-top:.75em}
.hero .hook b{font-weight:600}

.grid{display:grid;gap:14px}
.lead{max-width:70ch;margin:0 0 14px;color:var(--ink-2)}
.lead b{color:var(--ink);font-weight:600}
.nest{display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;margin:18px 0 24px}
.nest svg{flex:0 1 440px;min-width:0;width:100%;max-width:440px;height:auto;display:block}
.nest figcaption{flex:1 1 260px;max-width:46ch;font-size:14px;color:var(--ink-2)}
.nest figcaption b{color:var(--ink);font-weight:600}
.nest text{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;fill:var(--ink-2)}
.nest .quiet{fill:var(--ink-3);letter-spacing:.04em}
.nest .unit{fill:var(--surface);stroke:var(--signal);stroke-width:1.25}
.nest .unit.in{fill:var(--paper)}
.nest .unit.msg{fill:var(--signal-soft)}
.nest .sib{fill:var(--paper);stroke:var(--line)}
.nest .nb{fill:var(--sunk)}
.nest .flow{fill:none;stroke:var(--ink-3);stroke-width:1.25}
.nest .head{fill:var(--ink-3)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 30px}
@media (max-width:820px){.levels{grid-template-columns:minmax(0,1fr)}}
.lvl{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.lvl-hd{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--sunk);
  border-bottom:1px solid var(--line)}
.lvl-t{flex:1;min-width:0}
.lvl-t h4{font-size:18px}
.lvl-t .era{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.lvl-g{flex:none;width:34px;height:34px}
.lvl-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.25}
.lvl-g rect.on{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.75}
.lvl-facts{display:grid;gap:11px;padding:13px 14px;font-size:14px;color:var(--ink-2);flex:1;align-content:start}
.lvl-facts .k{display:block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.11em;color:var(--ink-3);margin-bottom:2px}
.lvl .taught{margin:0 14px 13px;align-self:flex-start;font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--signal);border:1px solid var(--signal);padding:2px 7px;border-radius:2px}
h2.sec{font-size:13px;font-family:var(--f-mono);font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink-3);border-bottom:1px solid var(--line);
  padding-bottom:7px;margin:38px 0 16px}
h2.sec:first-of-type{margin-top:0}

.road{--rg:44px;--nx:22px;list-style:none;margin:22px 0 0;padding:0;display:grid;gap:18px;
  grid-template-columns:minmax(0,1fr)}
.stop{position:relative;display:flex;padding-left:32px}
.stop .phase{flex:1;min-width:0}
.stop::before{content:"";position:absolute;background:var(--line);left:6px;top:26px;width:2px;height:calc(100% + 18px)}
.stop:last-child::before{display:none}
.node{position:absolute;z-index:1;box-sizing:border-box;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--ink-3);background:var(--paper);left:0;top:19px}
.stop:last-child .node{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink-3)}
.stop.done:last-child .node{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--signal)}
.gate-pad{display:none}
.stop.begun .node{border-color:var(--signal)}
.stop.done .node{border-color:var(--signal);background:var(--signal)}
.stop.done::before,.stop.prev-done .node::before{background:var(--signal)}
@media (min-width:620px){
  .road{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--rg);row-gap:26px}
  .stop{padding:30px 0 0}
  .gate-pad{display:block}
  .node{left:var(--nx);top:3px}
  .stop::before{left:calc(var(--nx) + 7px);top:9px;height:2px;width:calc(100% + var(--rg))}
  .node::before{content:"";display:none;position:absolute;background:var(--line);height:2px;top:4px;
    left:calc(-2px - var(--nx));width:var(--nx)}
  .stop::after{content:"";display:none;position:absolute;top:5px;right:1px;width:8px;height:8px;
    border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
  .stop.done::after{border-color:var(--signal)}
}
@media (min-width:620px) and (max-width:979px){
  .stop:nth-child(2n)::before{width:calc(100% - var(--nx) - 7px)}
  .stop:nth-child(2n):not(:last-child)::after{display:block}
  .stop:nth-child(2n+1):not(:first-child) .node::before{display:block}
  .stop:last-child:nth-child(2n+1){grid-column:1/-1}
}
@media (min-width:980px){
  .road{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stop:nth-child(3n)::before{width:calc(100% - var(--nx) - 7px)}
  .stop:nth-child(3n):not(:last-child)::after{display:block}
  .stop:nth-child(3n+1):not(:first-child) .node::before{display:block}
}
.phase{background:var(--surface);border:1px solid var(--line);padding:15px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.phase .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phase .sn{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.phase h3{font-size:18px}
.phase .goal{font-size:14px;color:var(--ink-2);flex:1;margin-bottom:14px}
.phase .mods{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);
  color:var(--ink-3);cursor:pointer;background:none;border-radius:2px}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip.done{background:var(--signal-soft);border-color:var(--signal);color:var(--signal);font-weight:700}

/* ---- modules ---- */
.mod-wrap{display:grid;grid-template-columns:238px 1fr;gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);max-height:calc(100vh - 90px);
  overflow-y:auto;border-right:1px solid var(--line);padding-right:12px}
.rail .grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 5px;padding-left:2px}
.rail .grp:first-child{margin-top:0}
.rail button.m{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;
  background:none;border:0;cursor:pointer;padding:5px 7px;color:var(--ink-2);
  font-family:var(--f-body);font-size:14px;line-height:1.3;border-radius:3px}
.rail button.m:hover{background:var(--sunk);color:var(--ink)}
.rail button.m[aria-current="true"]{background:var(--sunk);color:var(--ink);font-weight:600;
  box-shadow:inset 2px 0 0 var(--signal)}
.rail .id{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);min-width:26px}
.rail button.m[aria-current="true"] .id{color:var(--signal)}
.rail .tick{margin-left:auto;color:var(--ok);font-size:12px}
.rail .gate{font-family:var(--f-mono);font-size:10px;color:var(--gate);background:var(--gate-soft);
  padding:3px 7px;margin:7px 0 2px;letter-spacing:.06em;border-radius:2px}

.mod{max-width:75ch}
.mod-hd{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.mod-hd .id{font-family:var(--f-mono);font-size:12px;color:var(--signal);letter-spacing:.08em}
.mod-hd h2{font-size:clamp(22px,3.4vw,31px);font-weight:700;letter-spacing:-.025em;margin:5px 0 10px}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.facts b{color:var(--ink-2);font-weight:500}
.star{background:var(--signal-soft);border-left:3px solid var(--signal);padding:12px 15px;margin:18px 0}
.star .slab{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--signal);display:block;margin-bottom:4px}
.star p{margin:0;font-weight:600;font-size:16px}
.mod h3{font-family:var(--f-mono);font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-3);margin:28px 0 10px}
.mod p{margin:0 0 .85em}
.mod ul{margin:0 0 1em;padding-left:1.15em}
.mod li{margin-bottom:.35em}
.mod .why{color:var(--ink-2)}
.quote{border-left:2px solid var(--line);padding-left:14px;color:var(--ink-2);font-style:italic;
  margin:0 0 1em}

.lab{border:1px solid var(--line);background:var(--surface);padding:12px 14px;margin-bottom:9px;
  display:flex;gap:11px;align-items:flex-start}
.lab input{margin:4px 0 0;accent-color:var(--signal);width:15px;height:15px;flex:none;cursor:pointer}
.lab .body{flex:1;min-width:0}
.lab .t{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.lab .lid{font-family:var(--f-mono);font-size:11px;color:var(--signal);font-weight:500}
.lab .ttl{font-weight:600}
.lab .hrs{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.lab .d{font-size:14px;color:var(--ink-2);margin:5px 0 0}
.lab .s{font-size:13px;margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line-2);color:var(--ink-2)}
.lab .s b{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ok);font-weight:700}
.lab.on{border-color:var(--signal);background:var(--signal-soft)}

.sc{border:1px solid var(--line);background:var(--surface);margin-bottom:6px}
.sc summary{padding:10px 13px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;
  display:flex;gap:9px;align-items:flex-start}
.sc summary::-webkit-details-marker{display:none}
.sc summary::before{content:"?";font-family:var(--f-mono);color:var(--signal);font-weight:700;flex:none}
.sc[open] summary::before{content:"\2713";color:var(--ok)}
.sc summary:hover{background:var(--sunk)}
.sc > div{padding:0 13px 12px 35px;font-size:14px;color:var(--ink-2);border-top:1px dashed var(--line-2);
  margin-top:0;padding-top:10px}
.evidence{border:1px solid var(--signal);padding:12px 15px;background:var(--surface)}
.evidence .lab2{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--signal);display:block;margin-bottom:5px}
.fails{list-style:none;padding:0}
.fails li{padding-left:1.15em;position:relative;color:var(--ink-2);font-size:14.5px}
.fails li::before{content:"×";position:absolute;left:0;color:var(--warn);font-weight:700}
.mod-foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;border-radius:3px}
.btn:hover{border-color:var(--signal);color:var(--signal)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--paper);font-weight:700}
.btn.pri.off{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:400}

/* ---- people ---- */
.people{grid-template-columns:repeat(auto-fit,minmax(288px,1fr))}
.person{background:var(--surface);border:1px solid var(--line);padding:15px;box-shadow:var(--shadow)}
.person h3{font-size:17px}
.knownas{font-family:var(--f-mono);font-size:12px;color:var(--signal);font-weight:400;letter-spacing:-.01em;margin-left:8px}
.person .asof{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin:-4px 0 8px}
.warnbox{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);padding:13px 16px;margin-bottom:24px;font-size:14px;color:var(--ink-2);max-width:78ch}
.warnbox b{font-weight:600}
.person .doc{font-family:var(--f-mono);font-size:10.5px;color:var(--signal);letter-spacing:.05em;
  text-transform:uppercase;margin:4px 0 8px}
.person p{margin:0 0 .6em;font-size:14px;color:var(--ink-2)}
.person .crit{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:13.5px}
.person .crit b{font-family:var(--f-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--warn);display:block;margin-bottom:3px}
.person{display:flex;flex-direction:column}
.person .crit{flex:1}
.person .follow{border-top:1px dashed var(--line);padding-top:9px;margin-top:10px;display:flex;flex-wrap:wrap;
  gap:4px 12px;align-items:baseline;font-family:var(--f-mono);font-size:11px}
.person .follow b{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);font-weight:700;
  width:100%;margin-bottom:1px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px;background:var(--surface)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--ink-3);background:var(--sunk);font-weight:700}
tr:last-child td{border-bottom:0}
td.q{font-weight:600;white-space:nowrap}
td.pos{color:var(--ink-2)}
td.crs{border-left:2px solid var(--signal)}

/* ---- resources ---- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.res{border:1px solid var(--line);background:var(--surface);padding:11px 13px;margin-bottom:7px;
  display:flex;gap:11px;align-items:flex-start}
.res{flex-wrap:wrap}
.res.is-p{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--signal) 40%,transparent)}
