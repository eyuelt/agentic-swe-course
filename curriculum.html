"use strict";
const SC = {"M1": [["METR found experienced developers were 19% slower with AI tooling. What did those same developers believe about their own speed, and why does that gap matter more than the 19%?", "They estimated they had been 20% faster. The 39-point swing is a fact about self-assessment under high subjective fluency, not about 2025 tooling — which is why you cannot substitute the literature for your own baseline."], ["Name the four numbers this course asks you to log per task.", "Wall-clock to merged (not time the agent ran); rework passes; read ratio (fraction of the shipped diff you actually read); verification events (times something other than you or the model confirmed correctness)."], ["Why must the prediction be written before the task rather than after?", "A prediction written afterward is not a prediction. It silently destroys every calibration measurement downstream, and calibration is the thing M1 is training."], ["Why is METR redesigning the experiment, and what does that imply for you?", "They can no longer recruit cleanly — developers refuse to work half their tasks without AI, and 30–50% decline to submit tasks they think AI handles well. Clean control groups are disappearing, so the literature is becoming structurally unable to answer the question for an individual practitioner."], ["What are the three intervention types in the session taxonomy, and which one rising is the warning sign?", "Steering (redirecting a fine approach), correcting (fixing a wrong output), rescuing (aborting). A rising *rescue* share means your briefs or your context have degraded."]], "M2": [["Complete the sentence: an agent is an LLM, a loop, and ___.", "Enough tokens. Thorsten Ball's formulation — demonstrable in under 400 lines."], ["The agent claims a file exists that does not. Explain the failure in loop terms, without using the word 'hallucinate'.", "No tool result in the message list contradicted it. The model never sees your filesystem — it sees tool results you appended to a list."], ["Why can a loop that cannot change its own context never terminate usefully?", "The stop condition is evaluated against context. If nothing in context changes between iterations, the same input produces the same decision forever. This is the seed of the loop-engineering module."], ["Two harnesses report scores 15 points apart on the same benchmark with the same base model. What does that tell you?", "That the harness co-authors the number. Scaffolding moves benchmark results by double digits, which is the first reason public benchmarks cannot predict your outcomes."], ["Name two ways a badly designed tool *result* breaks an agent.", "An 8,000-token build log is a context bomb (it evicts everything useful); silent truncation is a correctness bomb (the agent reasons confidently from a partial picture with no marker telling it so)."]], "M3": [["What are the four parts of a brief, and which one do people omit?", "Goal (in outcomes, not steps), constraints, acceptance criteria, and verification means. The fourth is the one people omit and the one that matters most."], ["State the abandonment rule.", "First correction: steer. Second correction on the same issue: stop, discard the context, rewrite the brief. Steering a bad trajectory costs more than restarting."], ["Why is correcting in-context often worse than starting clean?", "The failed approach is *evidence* in the message list. Corrections pile new instructions on top of visible failed reasoning, and the model keeps referencing it."], ["The agent gets one of your conventions wrong. Where does the fix belong, and where does it not?", "In the memory file or a skill, once. Not in the chat — a chat correction fixes this session and nothing else."], ["What single estimate, made before you start, determines brief length, whether to plan, whether to isolate, and whether you can walk away?", "Blast radius — how many files the change touches and roughly how long it will take."]], "M4": [["Why is an agent with a working verifier categorically different from one without, rather than just better?", "With a verifier it is doing search with a fitness function — an optimizer. Without one it is generating plausible text and stopping when it feels done — a random walk."], ["Name four rungs of the verifier ladder in ascending order.", "Any ascending four from: nothing → compiler/types → linter → existing tests → new tests for this change → property/fuzz tests → running the software → preview deploy → domain-expert human review."], ["Why ask for tests in the same session as the implementation?", "The model still holds the implementation reasoning in context, so the tests are better and bugs surface during writing. Tests written fresh against finished code tend to be tautological restatements of what the code does."], ["List three ways an agent told to 'make the tests pass' can comply without doing what you meant.", "Weaken the assertion; delete or skip the test; special-case the test input; mock the thing under test. Kent Beck watches specifically for disabled tests and unrequested functionality."], ["Steinberger says he barely reads code. What makes that survivable for him, and why is copying the behaviour alone dangerous?", "Verification stacked elsewhere: agent-written tests in the same context, continuous builds, two-minute preview deploys, atomic revertible commits, and playing with the running software. Not reading is a position you earn by building verification, not a shortcut taken instead of it."], ["Why does a 5-second test run 40 times beat a 20-minute suite run twice?", "Iteration frequency is what turns the loop into an optimizer. Optimising a suite for agent iteration frequency is a different objective from the one most suites were built for."]], "M5": [["Give the risk-ordered review sequence, first three categories.", "Deletions and test changes; security and boundary surface (auth, input handling, permissions, secrets, untrusted input); data and migrations. Then concurrency/money/time zones, public interfaces, new dependencies, everything else."], ["If tests catch bugs better than review does, what is review actually for?", "Maintaining mental alignment about what changed and why. That reframing is what makes upstream review of research and plans coherent."], ["What is comprehension debt, and why is it more dangerous than technical debt?", "The gap between code shipped and code understood. It is invisible in the codebase and lives only in your head, so you discover it during an incident rather than during planning."], ["Why should a different context review the code than wrote it?", "The same context is grading its own homework — it will defend its earlier reasoning. A fresh or differently-instructed context is doing real work."], ["DHH reads beauty as a correctness signal. Where does that hold and where does it break?", "Evidence for local correctness; weak evidence for architectural correctness. Agent output is often superficially beautiful and conceptually wrong, because surface style is exactly what a language model is best at."], ["Name the five conditions that must all hold before not reading a diff is defensible.", "Reversible in seconds; contained blast radius; a strong verifier ran; not security-, money- or data-critical; and you find out fast if it is wrong."]], "M6": [["Give the optimization priority for a context window, in order.", "Correctness (no wrong information) > completeness (no missing information) > size (no noise). Size is last — a lean context full of stale information is worse than a fat accurate one."], ["List the rot symptoms in the order they typically appear.", "Stops following conventions → re-reads files it already read → re-proposes rejected approaches → contradicts earlier decisions → becomes confidently wrong about the codebase."], ["What goes into a compaction artifact?", "End goal; approach being taken; steps completed; current blocker or failure state; critical file paths and dependencies. Written to a file, not just into the chat."], ["Name two things you must never compact away.", "Decisions with their rationale, and rejected approaches *with reasons* — otherwise they get re-proposed. Also exact file paths, acceptance criteria, and the failure state verbatim."], ["Why is the main reason to spawn a subagent not parallelism?", "Context isolation. A task may burn 50k tokens of searching to produce a 500-token answer, and you want only the answer. Design the return to look like a compaction artifact."], ["Steinberger runs an ~800-line agent file; current guidance says keep it under ~200. Both are right. Why?", "The principle is not a line count — always-on content must earn its place on *every single request*. In his single enormous product codebase nearly all of it applies to nearly every task. The test is: did this matter in the last ten sessions?"]], "M7": [["State the leverage argument for reviewing plans instead of diffs.", "A bad line of code is a bad line of code. A bad line of a plan becomes hundreds of bad lines of code. A bad line of research becomes thousands."], ["What is the review question for the research phase, and what do you do if the answer is no?", "Is this an accurate map of reality? Spot-check three claims against the actual source. If research is wrong, stop — everything downstream is poisoned."], ["What is the review question for the plan?", "If a competent stranger executed this literally, would the result be right? This is where scarce attention buys the most."], ["Why do research and plan artifacts belong in files rather than in the conversation?", "Durability across crashes and sessions; reviewability by humans and other agents; reuse on the next similar change; and they are the honest record of intent when the incident review happens months later."], ["The method failed on a Hadoop dependency removal. What does that failure teach?", "It amplifies insufficient research rather than rescuing it. Three hours of planning on a bad map produces a confident wrong direction faster."], ["When is this workflow the wrong tool?", "Small changes (planning a two-line fix is ceremony) and genuinely exploratory work, where you don't yet know what you want and the point is to find out by building."]], "M8": [["Name four things agents want from a codebase and the single property underneath all of them.", "Explicit types over inference; greppability; explicit dependencies; braces over significant whitespace; result types over exceptions; boring conventional structure. Underneath: local reasoning — agents work from a few loaded files with little spatial awareness of the codebase."], ["Why is a flaky test suite worse than no test suite?", "It destroys the fitness function. A flaky suite teaches the agent that failures are noise, so it stops treating red as information."], ["What does DHH's Rails argument generalize to, beyond Rails?", "The more your codebase looks like the idiom the model already knows, the less context you spend explaining yourself. Convention over configuration is a machine-readable interface."], ["Name three things that break greppability.", "Barrel files and re-export chains; import aliasing; string-keyed dynamic dispatch; heavy macros or codegen where the source of truth isn't the source."], ["Steinberger spends ~20% of his time on refactoring done entirely by agents. Why is that the most agent-appropriate work there is?", "It's mechanical, verifiable, high-volume and low-judgment — dead code removal, duplicate consolidation, deprecation sweeps."], ["How do you tell whether legibility work actually worked?", "It shows up in your baseline numbers — fewer rework passes, fewer 'the agent couldn't find it' sessions, higher first-pass success. If it doesn't, you improved your aesthetics, not your legibility."]], "M9": [["State the difference between an instruction and a hook in one sentence.", "An instruction is a request; a hook is a guarantee. 'Never edit .env' in a memory file is a request the model will usually honour; a pre-tool hook that blocks the edit is enforcement."], ["Give the trigger for each: memory file, skill, subagent, hook, plugin.", "Agent gets a convention wrong twice → memory file. Same prompt typed repeatedly, or a playbook pasted a third time → skill. A side task floods your conversation → subagent. Something must happen without asking → hook. A second repo needs the same setup → plugin."], ["What makes a subagent worth its overhead, and how do you measure it?", "The compression ratio — tokens read divided by tokens returned. An unspecified return gives you either a transcript (no compression) or a vague summary (lost information)."], ["When is MCP the right answer and when is a CLI better?", "MCP when the integration needs live connection, authentication, or actions a CLI cannot provide. A CLI when the model already knows the tool from training. Measure the context cost either way."], ["What is the configuration cargo cult, and what is the test against it?", "Copying someone else's extension kit, importing their codebase's assumptions and their model's quirks. Every item in your kit should trace to a specific failure you personally experienced."]], "M10": [["Cherny calls worktrees the biggest unlock; Steinberger runs agents in the same folder. What is each optimizing?", "Worktrees optimize isolation (no interference, clean review, safe abandonment) at the cost of setup and per-tree rebuilds. Same-folder optimizes latency and shared state at the cost of collision risk — tolerable only with atomic commits and tight supervision."], ["What sets most people's ceiling at 3–5 concurrent agents?", "Review capacity — not tooling, not quota. Parallelism moves the bottleneck from generation to your attention."], ["What makes a task a good parallel candidate?", "Independence in the file dimension *and* the review dimension. Three features in three subsystems parallelize; three refactors of one module do not."], ["Name two cases where parallelism is negative-value.", "Exploratory work where each step informs the next; tasks touching the same files; anything you lack the review budget for; anything where you don't yet know what done looks like."], ["Why do session ergonomics — naming, colours, one-key switching — matter disproportionately?", "Without them you spend your attention *finding* the agent that needs you. They're the difference between a workable 3 and a workable 6."]], "M11": [["Give the precondition hiding inside 'arrange it so it can just go forever'.", "An objective, automatable criterion of success. Where that exists, autonomy is available; where it doesn't, autonomy produces confident garbage at scale."], ["Name the five components of a working loop, plus the thing they all depend on.", "Trigger, isolation, knowledge, connection, and verification by a *separate* agent — plus persistent state on disk, because the model forgets everything between runs. The loop's memory is the filesystem."], ["What is overbaking, and what does it tell you about budget caps?", "A loop run past its useful life starts inventing work — unrequested features, speculative abstractions, in one recorded case unexpected cryptography. An agent with remaining budget and no remaining work will invent work. Budget caps are a correctness measure, not a cost measure."], ["Why do fresh contexts working from a persistent spec beat one long context working from memory?", "Each iteration starts at full attention with a correct, durable statement of the goal, instead of degrading attention over an accumulating transcript. It is intentional compaction, mechanized."], ["How many stop conditions does a loop need, and why?", "At least two — a success predicate and a failure or budget condition. With one, you are relying on noticing."], ["Karpathy says agents are jagged. Which half of the split does loop engineering work in?", "The verifiable, metric-driven half. They remain weak on nuance, on what you actually intended, and on knowing when to ask a clarifying question. Applying loops to that half is the central error of the era."]], "M12": [["What does async multiply, and what does it not?", "It multiplies production and does nothing for review. A dozen agent PRs waiting on Monday morning is not leverage."], ["What can you realistically do from a phone, and what does that imply about agent design?", "Approve or reject a plan, answer a blocking question, kill a run, read a summary. So design agents to ask well — a blocking question with three options beats an open one."], ["Name three ways to stop the review queue from becoming a backlog.", "Rate-limit production to review capacity; require self-review by a separate verifier before queueing; batch review into blocks; auto-merge classified low-risk categories on policy; escalate only what policy cannot classify."], ["Why is CI the highest-risk place to run an agent?", "It processes untrusted input — issue bodies, PR titles, comments — while holding credentials. That is the published CVE chain."]], "M13": [["State the lethal trifecta and the defence.", "Access to private data + exposure to untrusted content + ability to communicate externally. All three together are the vulnerability; any two are safe. Break one."], ["Walk the CVE-2025-66032 attack chain.", "Crafted issue on a public repo from a malicious GitHub App → authorization check trusts any App actor → injected instructions read the workflow environment → OIDC token extracted → exchanged for repository write access → malicious commit to the action's own source, poisoning downstream consumers."], ["What is remarkable about that chain from a model-capability standpoint?", "Nothing in it required a model failure. Every step was the agent doing exactly what it was told by text it had no way to distinguish from your instructions."], ["Isolation should rise with what — and what does it usually rise with instead?", "With autonomy. It usually rises with your comfort level, which grows faster than safety does."], ["Where does indirect prompt injection arrive from? Name four sources.", "A GitHub issue; a dependency's README; a web page; a code comment; an error message; a log line; an MCP tool result."], ["Why is an MCP server two risks rather than one?", "It is code you run, *and* a channel through which attacker-controllable text enters your context. Treat installing one as installing a dependency with your credentials attached."]], "M14": [["Why can't public benchmarks tell you whether a change to your setup helped?", "Different task distribution, different codebase, different harness — and harness choice alone moves scores by double digits on the same base model."], ["What makes a golden task useful, and why include ones you know fail?", "A pinned starting commit, the brief as you'd really write it, and an automated check where possible. Known failures are the most informative entries — they're where a new model's improvement first becomes visible."], ["Why is a single run per task close to worthless?", "Agent runs are stochastic. Most excited claims about a new model being better are within noise. Run 3–5 times and compare distributions."], ["Name three of your own configuration choices worth evaluating, not just models.", "Memory file contents; context minimalism vs pre-loading; plan-first vs direct; subagent return formats; verifier strength; reasoning effort."], ["If you use a model as judge, what two precautions apply?", "Use a different model family than the one under test, and spot-check its judgments yourself — LLM-as-judge is quietly biased toward its own family's style."]], "M15": [["What matters more in a tool result: the call design or the result design? Why?", "The result. It's what enters context. Return the minimum supporting the next decision; make errors actionable; truncate with an explicit marker and a way to get more."], ["What separates a demo agent from one you'd let run overnight?", "Persistence and resumption — session state on disk, resume from a state file, and idempotent operations so a resumed run doesn't double-apply."], ["Give the build-vs-extend-vs-buy rule.", "Extend when your harness has the seam — right about 80% of the time. Build when you need an agent inside your own product, an unusual loop shape, or full control of context. Buy the general coding harness."], ["Why prefer one flexible tool over twelve narrow ones?", "Tool definitions cost context, and choice among near-identical tools degrades selection. Fewer, broader tools with good results beat a large menu."]], "M16": [["What are DORA's three findings about AI at organizational scale?", "AI amplifies the existing system (strong orgs get stronger, dysfunctional ones get worse faster); there is a J-curve, an initial dip that is the tuition cost of transformation; and there is an instability tax — individual effectiveness rises while delivery stability falls."], ["Where does the bottleneck move when generation triples, and what follows from that?", "Review, then integration, then deployment confidence. Investment belongs at the bottleneck — faster CI, better automated review, trunk hygiene — not in more generation capacity."], ["Why must the author review their agent's output before a colleague sees it?", "Otherwise you are moving your comprehension debt onto someone else's balance sheet. Teams notice, and it poisons adoption faster than any technical problem."], ["What is the unresolved problem with juniors, stated precisely?", "The traditional apprenticeship ran through exactly the work agents now do. Without deliberately constructed learning paths you produce engineers who can prompt and cannot debug. Nobody has solved this; the course says so rather than inventing an answer."], ["Why does promising uniform productivity gains sink a rollout?", "Gains are strongly task-dependent — large on simple work, much smaller on complex legacy code. A uniform promise fails publicly in exactly the codebases that matter most."]], "M17": [["Which section of the doctrine document is most valuable, and which do people skip?", "The same one: 'what I am still bad at.' Everything else is easier to write and worth less."], ["Why re-run the baseline measurements at the end?", "Because felt improvement is unreliable — the same reason M1 exists. Some practitioners get slower at certain task classes while getting much faster overall, which is a real finding rather than a failure."], ["Name the four standing practices.", "Monthly: run the eval suite; monthly: one practitioner teardown. Quarterly: re-audit always-on context and the extension kit; quarterly: refresh the state-of-play file."], ["What is the actual deliverable of this course?", "Not a skill set — a method for acquiring skill sets faster than they expire. The half-life of technique here is short; the half-life of judgment is long."]]};
const IDS = Object.keys(M);
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- progress state ---------- */
let state = {mods:{}, labs:{}, res:{}};
let saveTo = null, dbDoc = null;

function loadLocal(){
  try{ const r = localStorage.getItem("ase.progress");
       if(r) state = Object.assign({mods:{},labs:{},res:{}}, JSON.parse(r)); }catch(e){}
}
function persist(){
  try{ localStorage.setItem("ase.progress", JSON.stringify(state)); }catch(e){}
  driveQueue();
  if(!dbDoc) return;
  clearTimeout(saveTo);
  saveTo = setTimeout(()=>{
    dbDoc.set({mods:state.mods, labs:state.labs, res:state.res, at:new Date().toISOString()})
      .then(()=> setSync("saved"))
      .catch(()=> setSync("local only"));
  }, 700);
}
let syncBase = "", syncDrive = "";
function setSync(t){ syncBase = t; paintSync(); }
function paintSync(){ const e=$("#sync"); if(!e) return;
  e.innerHTML = " · progress " + esc(syncBase) + (syncDrive ? " · " + syncDrive : ""); }

async function initStore(){
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return setSync("saved in this browser");
    const uid = await user.id();
    if(!uid) return setSync("saved in this browser");
    dbDoc = db.doc("data/users/" + uid + "/progress");
    const snap = await dbDoc.get();
    if(snap.exists){
      const d = snap.data() || {};
      state = {mods: d.mods || {}, labs: d.labs || {}, res: d.res || {}};
      renderAll();
    }
    setSync("synced to your account");
  }catch(e){ setSync("saved in this browser"); }
}

const modDone = id => !!state.mods[id];
const labDone = id => !!state.labs[id];
const resStat = id => state.res[id] || "";
function setRes(id, v){ if(v) state.res[id] = v; else delete state.res[id]; persist(); renderResources(); }
function toggleMod(id){ state.mods[id] = !state.mods[id]; persist(); renderAll(); }
function toggleLab(id){ state.labs[id] = !state.labs[id]; persist();
  renderModule(current); renderHeader(); renderOverview(); }

/* ---------- header ---------- */
function renderHeader(){
  const n = IDS.filter(modDone).length;
  $("#mbar").style.width = Math.round(n/IDS.length*100) + "%";
  $("#mtxt").textContent = n + "/" + IDS.length;
}

/* ---------- tabs ---------- */
const TABS = [["overview","Overview"],["modules","Modules"],["people","Practitioners"],
              ["resources","Resources"],["maintain","Maintain"]];
let tab = "overview", current = "M1";

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) =>
    '<button data-tab="'+k+'" aria-current="'+(tab===k)+'">'+l+'</button>').join("");
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if(b) go(b.dataset.tab); };
  const nav = $("#tabs"), cur = $('[aria-current="true"]', nav);   // keep the active tab in view when the row scrolls
  if(cur){ const l = cur.offsetLeft - nav.offsetLeft, r = l + cur.offsetWidth;
    const pad = 40;   // clear of the edge fade
    if(l - pad < nav.scrollLeft) nav.scrollLeft = l - pad; else if(r + pad > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = r + pad - nav.clientWidth; }
  nav.onscroll = tabFade; tabFade();
}
function tabFade(){   // fade whichever edge of the tab row still has tabs beyond it
  const nav = $("#tabs"); if(!nav) return;
  nav.classList.toggle("more-l", nav.scrollLeft > 2);
  nav.classList.toggle("more-r", nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
}
addEventListener("resize", tabFade);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(tabFade);
function go(t, mod){
  tab = t; if(mod){ current = mod; }
  TABS.forEach(([k]) => { $("#v-"+k).hidden = (k !== t); });
  renderTabs();
  if(t==="modules") renderModules();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- google drive sync ----------
   Optional. Progress always saves in this browser; connecting Google Drive also keeps a copy in the
   app's private folder in the reader's own Drive, so it follows them across devices.
   Setup (once, by the site owner): create an OAuth 2.0 "Web application" client in Google Cloud, add
   this site's origin under "Authorized JavaScript origins", and paste the client ID below. The ID is
   public by design. With no ID the option stays hidden.
   The access token is kept in localStorage until it expires (about an hour) so a reload does not drop
   the connection. It is scoped to drive.appdata, so it can open this site's own progress file and
   nothing else in the reader's Drive. */
const GOOGLE_CLIENT_ID = "573833575191-501c7pk90kgcpjbv4c2rg5m5tva7aqlv.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_FILE = "shipping-with-agents-progress.json";
const DRIVE_API = "https://www.googleapis.com/drive/v3/files", DRIVE_UP = "https://www.googleapis.com/upload/drive/v3/files";
const drive = {status:"off", token:null, fileId:null, at:null, err:"", timer:null, client:null, expired:false};

const driveLinked = () => { try{ return localStorage.getItem("ase.drive") === "1"; }catch(e){ return false; } };
function driveToken(tok, ttl){   // remember (or, with no arguments, forget) the sign-in for its lifetime
  drive.token = tok || null;
  try{ if(tok) localStorage.setItem("ase.driveTok", JSON.stringify({t:tok, exp:Date.now() + (ttl - 60) * 1000}));
       else localStorage.removeItem("ase.driveTok"); }catch(e){}
}
function driveRestore(){   // returns "ok", "expired" or "none"
  try{ const v = JSON.parse(localStorage.getItem("ase.driveTok") || "null");
       if(!v) return "none";
       if(v.exp > Date.now()){ drive.token = v.t; return "ok"; }
       localStorage.removeItem("ase.driveTok"); return "expired"; }catch(e){ return "none"; }
}
function setDrive(status, err){
  drive.status = status; drive.err = err || "";
  syncDrive = status === "on" ? "Google Drive synced " + drive.at.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})
    : status === "paused" ? 'Google Drive paused — <button data-drive="connect">reconnect</button>'
    : status === "error" ? "Google Drive sync failed" : "";
  paintSync(); if(!$("#settingsPanel").hidden) renderSettings();
}
function loadGis(){
  return new Promise((ok, no) => {
    if(window.google && google.accounts && google.accounts.oauth2) return ok();
    const el = document.createElement("script");
    el.src = "https://accounts.google.com/gsi/client"; el.async = true;
    el.onload = () => ok(); el.onerror = () => no(new Error("blocked"));
    document.head.appendChild(el);
  });
}
async function driveConnect(){
  setDrive("connecting");
  try{ await loadGis(); }catch(e){ return setDrive("unavailable"); }
  if(!drive.client) drive.client = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE,
    callback: r => { if(r.error) return setDrive("error", r.error);
      driveToken(r.access_token, r.expires_in || 3600); drive.expired = false;
      try{ localStorage.setItem("ase.drive", "1"); }catch(e){} driveSync(); },
    error_callback: e => setDrive(driveLinked() ? "paused" : "off",
      e && e.type === "popup_failed_to_open" ? "The sign-in window was blocked. Allow pop-ups and try again." : "")
  });
  drive.client.requestAccessToken(driveLinked() ? {prompt:""} : {});
}
async function gfetch(url, opts){
  opts = opts || {};
  const r = await fetch(url, Object.assign({}, opts, {headers: Object.assign({Authorization:"Bearer " + drive.token}, opts.headers)}));
  if(r.status === 401){ driveToken(); drive.expired = true; setDrive("paused"); throw new Error("expired"); }
  if(!r.ok) throw new Error("Drive returned " + r.status);
  return r;
}
function mergeState(remote){   // on connect, never lose a tick from either side
  for(const k of ["mods","labs"]) for(const id in (remote[k] || {})) if(remote[k][id]) state[k][id] = true;
  const rank = {p:1, r:2};
  for(const id in (remote.res || {})) if((rank[remote.res[id]] || 0) > (rank[state.res[id]] || 0)) state.res[id] = remote.res[id];
}
async function drivePush(){
  const body = JSON.stringify({mods:state.mods, labs:state.labs, res:state.res, at:new Date().toISOString()});
  if(drive.fileId){
    await gfetch(DRIVE_UP + "/" + drive.fileId + "?uploadType=media",
      {method:"PATCH", headers:{"Content-Type":"application/json"}, body});
  }else{
    const sep = "swa" + Date.now(), meta = JSON.stringify({name:DRIVE_FILE, parents:["appDataFolder"]});
    const r = await gfetch(DRIVE_UP + "?uploadType=multipart&fields=id", {method:"POST",
      headers:{"Content-Type":"multipart/related; boundary=" + sep},
      body:"--"+sep+"\r\nContent-Type: application/json\r\n\r\n"+meta+"\r\n--"+sep+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+sep+"--"});
    drive.fileId = (await r.json()).id;
  }
  drive.at = new Date();
}
async function driveSync(){   // pull, merge, push back
  try{
    if(!drive.fileId){
      const r = await gfetch(DRIVE_API + "?spaces=appDataFolder&fields=files(id)&q=" + encodeURIComponent("name='" + DRIVE_FILE + "'"));
      const f = (await r.json()).files || []; if(f.length) drive.fileId = f[0].id;
    }
    if(drive.fileId){
      const remote = await (await gfetch(DRIVE_API + "/" + drive.fileId + "?alt=media")).json().catch(() => null);
      if(remote) mergeState(remote);
    }
    await drivePush();
    try{ localStorage.setItem("ase.progress", JSON.stringify(state)); }catch(e){}
    renderAll(); setDrive("on");
  }catch(e){ if(drive.status !== "paused") setDrive("error", e.message); }
}
function driveQueue(){   // called on every progress change
  if(!drive.token) return;
  clearTimeout(drive.timer);
  drive.timer = setTimeout(() => drivePush().then(() => setDrive("on"))
    .catch(e => { if(drive.status !== "paused") setDrive("error", e.message); }), 1200);
}
function driveDisconnect(){
  try{ if(drive.token && window.google) google.accounts.oauth2.revoke(drive.token, () => {}); }catch(e){}
  try{ localStorage.removeItem("ase.drive"); }catch(e){}
  driveToken(); drive.fileId = null; setDrive("off");
}

/* ---------- settings ---------- */
function renderSettings(){
  const pref = themePref(), st = drive.status;
  const driveUi = !GOOGLE_CLIENT_ID ? '' :
    st === "on" ? '<p><span class="dot on"></span>Syncing to your Google Drive. Last synced '+
        drive.at.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})+'.</p>'+
        '<div class="acts"><button class="btn" data-drive="sync">Sync now</button>'+
        '<button class="btn" data-drive="disconnect">Disconnect</button></div>'
    : st === "connecting" ? '<p><span class="dot"></span>Waiting for Google sign-in…</p>'
    : st === "paused" ? '<p><span class="dot warn"></span>Google Drive sync is paused. '+
        (drive.expired ? 'Your Google sign-in lasts about an hour and has run out.'
                       : 'It needs one click to reconnect.')+
        ' Your progress is still saved in this browser, and reconnecting merges it with the copy in Drive.</p>'+
        '<div class="acts"><button class="btn pri" data-drive="connect">Reconnect</button>'+
        '<button class="btn" data-drive="disconnect">Disconnect</button></div>'
    : st === "unavailable" ? '<p><span class="dot warn"></span>Google sign-in could not load here. Progress stays in this browser.</p>'
    : (st === "error" ? '<p><span class="dot warn"></span>Google Drive sync failed'+(drive.err ? ' ('+esc(drive.err)+')' : '')+
        '. Your progress is still saved in this browser.</p>' : '')+
      '<div class="acts"><button class="btn pri" data-drive="connect">'+(st === "error" ? 'Try again' : 'Sign in with Google')+'</button></div>';
  $("#settingsPanel").innerHTML =
    '<h3>Appearance</h3>'+
    '<div class="seg" role="group" aria-label="Theme">'+ [["system","System"],["light","Light"],["dark","Dark"]].map(o =>
      '<button data-theme-set="'+o[0]+'" aria-pressed="'+(pref===o[0])+'">'+o[1]+'</button>').join("")+'</div>'+
    '<h3>Progress</h3>'+
    '<p>Saved in this browser'+(dbDoc ? ' and synced to your account' : '')+'.'+
      (GOOGLE_CLIENT_ID && st === "off" ? ' Sign in with Google to keep a copy in your Google Drive and pick up where you left off on another device.' : '')+'</p>'+
    driveUi+
    (GOOGLE_CLIENT_ID ? '<p class="fine">Stored in this site’s private app folder in your Drive. The site cannot see any of your other files.</p>' : '')+
    (!GOOGLE_CLIENT_ID && drive.err ? '<p class="fine">'+esc(drive.err)+'</p>' : '');
}
function initSettings(){
  setTheme(themePref());
  const btn = $("#settingsBtn"), panel = $("#settingsPanel");
  const close = () => { if(panel.hidden) return; panel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  btn.onclick = () => {
    if(!panel.hidden){ close(); return; }
    renderSettings(); panel.hidden = false; btn.setAttribute("aria-expanded", "true");
    if(GOOGLE_CLIENT_ID) loadGis().catch(() => {});   // so the sign-in click can open its window straight away
    const first = $("button", panel); if(first) first.focus();
  };
  document.addEventListener("click", e => {
    const d = e.target.closest("[data-drive]");
    if(d){ ({connect:driveConnect, sync:driveSync, disconnect:driveDisconnect})[d.dataset.drive](); return; }
    const t = e.target.closest("[data-theme-set]");
    if(t){ setTheme(t.dataset.themeSet); renderSettings(); $('[data-theme-set="'+t.dataset.themeSet+'"]').focus(); return; }
    if(!e.target.closest(".settings")) close();
  });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !panel.hidden){ close(); btn.focus(); } });
  if(GOOGLE_CLIENT_ID && driveLinked()){
    const had = driveRestore();
    if(had === "ok") driveSync();   // still signed in from earlier: carry on without asking
    else { drive.expired = had === "expired"; setDrive("paused"); }
  }
}

/* ---------- boot ---------- */
function renderAll(){
  renderHeader(); renderOverview(); renderPeople(); renderResources(); renderMaintain();
  if(tab === "modules") renderModules();
}
loadLocal();
initSettings();
renderTabs();
renderAll();
go("overview");
setSync("saved in this browser");
initStore();
</script>
