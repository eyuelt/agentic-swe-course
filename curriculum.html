M1:{t:"Baseline & Instrumentation",st:0,pre:"none",hrs:"4–6 h + 2 weeks logging",
 star:"You cannot improve what you have not baselined, and your felt sense of speed is actively misleading.",
 why:"METR's 2025 randomized trial found experienced open-source developers were <b>19% slower</b> with AI tooling while estimating they had been <b>20% faster</b>. The 39-point swing is not a fact about 2025 tools — it is a fact about human self-assessment under high subjective fluency. METR's 2026 follow-up narrowed the effect and then announced a redesign, because developers now refuse to work without AI and decline to submit tasks they think AI handles well. The literature is becoming structurally unable to answer the question for you. So you answer it yourself.",
 out:["A measurement practice that survives the course","Calibrated intuition: predict a task's duration, then check yourself","A dated, falsifiable statement of what you currently believe"],
 key:["<b>Four numbers, logged by hand</b>, beat twenty collected automatically: wall-clock to <i>merged</i>; rework passes; <b>read ratio</b> (what fraction of the shipped diff you actually read — the comprehension-debt meter); and verification events (how many times something other than you or the model confirmed correctness — zero is a valid and alarming answer).","Predictions go in <i>before</i> the task. Calibration is trainable and this is the training.","Your 'without AI' baseline will be contaminated. Record the contamination and take it anyway."],
 labs:[
  {id:"L1.1",t:"The prediction log",h:"30 min + ongoing",d:"One row per task in ase/log.md: predicted minutes and rework passes, then actuals, read ratio, verification events, one-sentence note. Two weeks, agent-assisted or not.",s:"≥20 rows, ≥5 of them non-agent tasks."},
  {id:"L1.2",t:"The control tasks",h:"3 h",d:"Four comparable tasks in a codebase you know. Two entirely by hand — no completion, no agent. Two with your current setup, without improving it.",s:"Four honest rows plus a paragraph on what surprised you."},
  {id:"L1.3",t:"The dated beliefs statement",h:"1 h",d:"400–600 words on what you believe agents are good at, bad at, and what you expect to change. Commit it. Do not edit it — you re-read it in M17.",s:"Specific enough to be falsifiable. 'Agents are useful' is not."},
  {id:"L1.4",t:"Instrument one session",h:"1 h",d:"Record one session. Mark every intervention as steering, correcting, or rescuing.",s:"One annotated transcript with the intervention taxonomy applied."}],
 ev:"ase/log.md with ≥20 rows including ≥4 controls, ase/beliefs-2026.md, and one annotated session.",
 fails:["Skipping the module because it is not fun — the most common failure","Automating the logging before you know what to log","Logging only successes","Reading METR as a verdict on agents rather than on self-assessment"],
 read:"METR 2025 study · METR 2026 design update · DORA 2026 (J-curve section only)"},

M2:{t:"The Agentic Loop: Build an Agent",st:1,pre:"M1",hrs:"6–10 h",
 star:"An agent is a while-loop around a model with tools. Every 'magic' behaviour and every failure is explicable at that level.",
 why:"Almost everything mysterious about agents — 'it forgot', 'it hallucinated a file', 'it went in circles' — becomes transparent once you have written the loop. Thorsten Ball's claim is that a coding agent is an LLM, a loop, and enough tokens, demonstrable in under 400 lines. He is right, and the demonstration is the most efficient demystification available. This is agent-system design placed at the <i>front</i> of a practitioner course, because after it you debug agents by reasoning about context instead of rewriting prompts and hoping.",
 out:["Implement a working coding agent with read/write/search/execute tools","Trace any misbehaviour to context, tool definition, tool result, or stop condition","Read the features of a harness (e.g. Claude Code, Codex CLI, OpenCode or Cursor) as design choices with tradeoffs"],
 key:["The model never sees your filesystem. It sees <i>tool results you appended to a list.</i> 'It forgot' means the fact left the list or never entered it. 'It hallucinated a file' means no tool result contradicted it.","<b>A loop that cannot change its own context cannot terminate usefully.</b> This is the seed of M11.","Tool <i>results</i> matter more than tool calls. An 8,000-token build log is a context bomb; silent truncation is a correctness bomb.","Benchmark scores vary by double digits between harnesses running the same base model. The harness is a co-author of that number."],
 labs:[
  {id:"L2.1",t:"Build the agent",h:"4–6 h",d:"Follow Ball's tutorial in a language you know — type it, don't copy it. Minimum: chat loop, read_file, list_files, bash, edit_file.",s:"Your agent reads, edits and runs tests in a real repo in one session without you touching files."},
  {id:"L2.2",t:"Break it deliberately",h:"1–2 h",d:"Four experiments, each with a written prediction first: (a) don't append tool results; (b) make bash return exit codes only; (c) truncate read_file with no marker; (d) remove the stop condition, cap at 20 iterations.",s:"A prediction-vs-observation table for all four, each failure mapped to loop mechanics."},
  {id:"L2.3",t:"Add one harness feature",h:"2 h",d:"Implement a permission prompt, naive compaction, or a spawn_subagent tool returning only a final message.",s:"It works, plus 200 words on what it cost in latency, tokens, or correctness risk."},
  {id:"L2.4",t:"Harness teardown",h:"1 h",d:"Map your daily harness onto your loop. Where does plan mode intervene? What does compaction remove? What does a subagent return, and what is lost?",s:"A one-page annotated diagram."}],
 ev:"A working agent, the four-experiment table, one harness feature with a cost analysis, the teardown diagram.",
 fails:["Copy-pasting the tutorial instead of typing it","Adding features before the bare loop works","Skipping L2.2 — it is where the learning is"],
 read:"Ball, How to Build an Agent · your harness's docs"},

M3:{t:"Briefing, Steering, Abandoning",st:1,pre:"M2",hrs:"6–8 h",
 star:"Steering a bad trajectory is more expensive than restarting. The expensive move is the one that feels cheap.",
 why:"The highest-leverage minute is the one before you press enter. Cherny's framing — treat the agent as an engineer you delegate to, not a pair programmer you guide — changes what the opening message must carry. Steinberger's is the complementary skill: minimal ceremony, high volume, fast abandonment. These are two halves of one thing: invest in the brief proportionally to blast radius, and abandon fast when the trajectory is wrong.",
 out:["Write briefs calibrated to blast radius","Recognise a doomed trajectory within ~2 minutes and abandon rather than negotiate","Know why correcting in-context is often worse than restarting clean"],
 key:["<b>Blast-radius assessment before you start.</b> Estimate files touched and duration; that single estimate sets brief length, whether to plan, whether to isolate, and whether you can walk away.","<b>The four-part brief:</b> goal (in outcomes, not steps) · constraints · acceptance criteria · <b>verification means</b>. The fourth is the one people omit and the one that matters most.","Underspecify implementation, overspecify verification. Models plan implicitly and well; they cannot infer your definition of done.","<b>First correction: steer. Second correction on the same issue: discard the context and rewrite the brief.</b> A failed approach in context is evidence the model keeps referencing.","When the agent gets a <i>convention</i> wrong, the fix belongs in a memory file or skill — once — not in the chat.","Screenshots beat paragraphs for anything visual (~half of Steinberger's prompts include an image). Voice beats typing for long briefs."],
 labs:[
  {id:"L3.1",t:"Brief archaeology",h:"2 h",d:"Take five sessions that went badly. Write the brief you should have written. Re-run two in clean sessions.",s:"Five rewritten briefs; ≥1 measurable improvement; a note on the one that didn't improve and why."},
  {id:"L3.2",t:"Blast-radius calibration",h:"2 h",d:"Predict file count and duration for ten upcoming tasks; record actuals.",s:"A stated personal correction factor, e.g. 'I underestimate file count 2× on anything touching the API layer'."},
  {id:"L3.3",t:"The abandonment drill",h:"1.5 h",d:"Five tasks with a hard rule: at the second correction on the same issue you must discard and restart. No exceptions, even when it feels close.",s:"Five sessions, with a note on how many felt 'nearly there' and how the restarts actually went."},
  {id:"L3.4",t:"Modality experiment",h:"1.5 h",d:"Three visual tasks described in text vs three with screenshots. Three briefs dictated vs three typed.",s:"Logged comparison and a personal policy on when to use which."}],
 ev:"Five rewritten briefs with outcomes, a calibration factor, the abandonment log, and a one-page briefing standard you will follow.",
 fails:["Enormous briefs for small tasks — ceremony as procrastination","Negotiating with a doomed session because of sunk cost","Corrections in chat instead of memory files","Omitting verification means from every brief"],
 read:"Cherny tips compilation · Steinberger, Just Talk To It"},

M4:{t:"Verification-First Development",st:1,pre:"M2",hrs:"8–12 h",kw:"keystone",
 star:"Every task gets a verifier the agent can run itself. No verifier, no autonomy — at any level.",
 why:"Cherny's most repeated claim is that giving the agent a way to check its own output roughly <b>2–3×'s the quality</b> of results. Kent Beck arrives at the same place from the opposite direction. The reason is structural: an agent in a loop with a working verifier is doing search with a fitness function; without one it is generating plausible text and stopping when it feels done. That is the difference between an optimizer and a random walk.<br><br>This is also what licenses the expert behaviour that looks reckless. Steinberger says he doesn't read much code — but agents write tests in the same context as the implementation, builds watch continuously, preview deploys land in two minutes, commits are atomic and revertible. <b>Not reading the code is a position you earn by building verification, not a shortcut you take instead of it.</b>",
 out:["Build a verification loop for any task type: backend, frontend, CLI, data, infra","Judge verifier quality — coverage, determinism, speed, falsifiability","Recognise and prevent the agent gaming its own verifier"],
 key:["<b>The verifier ladder</b>, rung 0 to 8: nothing → compiler → linter → existing tests → new tests → property tests → running the software → preview deploy → domain-expert human review. Cheap rungs are not optional <i>because</i> they are cheap — they are the ones the agent runs every iteration.","<b>Tight loops beat thorough ones.</b> A 5-second test run 40 times finds more than a 20-minute suite run twice. Optimise the suite for agent iteration frequency — a different objective than most suites were built for.","<b>Tests in the same context as the implementation.</b> The model still holds the implementation reasoning; tests written in a fresh session against finished code tend to be tautological restatements.","<b>The tautology trap.</b> An agent told to make tests pass can weaken assertions, delete tests, special-case the input, skip, or mock the thing under test. Beck watches specifically for disabled tests and unrequested functionality.","TDD becomes load-bearing rather than merely good: it gives the agent an unambiguous stop condition and you a reviewable sequence."],
 labs:[
  {id:"L4.1",t:"The verifier audit",h:"2 h",d:"Score your last 15 agent-assisted changes on the ladder. Compute the distribution.",s:"A table plus a diagnosis of your weakest rung and the cheapest way to raise it."},
  {id:"L4.2",t:"Build the fast lane",h:"3–4 h",d:"Create a target running the most informative checks in under 15 seconds. Wire it into the agent's memory file; add a post-edit hook.",s:"Under 15s measured, and the agent runs it unprompted in a fresh session."},
  {id:"L4.3",t:"Same-context tests",h:"2 h",d:"Three features with tests requested in the same session. A fourth with tests requested in a fresh session. Compare.",s:"Four suites with a written comparison, including ≥1 identified tautological test."},
  {id:"L4.4",t:"Adversarial verification",h:"2 h",d:"Give an agent a deliberately weak test and instruct it only to make the tests pass. Document every way it games the verifier.",s:"A catalogue of ≥3 gaming behaviours you personally observed, with a guardrail for each."},
  {id:"L4.5",t:"Close a non-test loop",h:"2 h",d:"Pick a task where tests are a bad fit — a UI change, a CLI's output format. Give the agent a way to observe its own output.",s:"A transcript showing the agent observing, judging and correcting itself without you."}],
 ev:"The audit with diagnosis, a sub-15-second fast lane, the same-context comparison, the gaming catalogue, one non-test loop transcript.",
 fails:["Treating 'the tests pass' as sufficient","Slow test suites left slow","Letting the agent write both test and assertion unreviewed","Copying 'I don't read code' without first building rungs 4–7"],
 read:"Beck, Augmented Coding · Cherny on verification · Steinberger, Shipping at Inference-Speed (read critically)"},

M5:{t:"Reading the Machine: Review Discipline",st:1,pre:"M4",hrs:"6–8 h",
 star:"Choose where you spend your scarce reading attention — research, plan, or diff — and know what that choice leaves uncovered.",
 why:"Review is the bottleneck at two scales. Individually, you generate more code per hour than you can read. Organizationally, DORA's 2026 analysis names the verification tax as a major cost driver and finds AI adoption correlating with <i>rising delivery instability</i> even as throughput rises. The experts genuinely diverge: DHH reviews every diff and reads beauty as a correctness signal; Steinberger reads little, backed by heavy automation and trivial reverts; Horthy moves review upstream entirely.",
 out:["Triage a diff by risk rather than reading linearly","Apply upstream review and know its blind spots","Name and manage comprehension debt as an explicit liability"],
 key:["<b>Review is for mental alignment</b>, not primarily bug-catching (tests do that better). That reframing is what makes upstream review coherent: aligning on the plan beats aligning on its consequences.","<b>Risk-ordered reading</b>, stop when the budget is spent: deletions and test changes → security and boundary surface → data and migrations → concurrency, money, time zones → public interfaces → new dependencies → everything else.","<b>Comprehension debt</b> is invisible in the codebase and lives only in your head. You discover it during an incident at 3am. Track read ratio; mark low-comprehension modules; budget repayment.","Never let the context that wrote the code review it. A fresh or differently-instructed context is doing real work; the same context is grading its own homework.","Agent output is often <i>superficially</i> beautiful and conceptually wrong — surface style is exactly what a language model is best at. Beauty is evidence for local correctness, weak evidence for architectural correctness.","Not reading is defensible when all five hold: reversible in seconds, contained blast radius, a strong verifier ran, not security/money/data-critical, and you find out fast. Most enterprise contexts satisfy none."],
 labs:[
  {id:"L5.1",t:"Risk-ordered review drill",h:"2 h",d:"Five recent agent PRs reviewed twice: 10 minutes linear, 10 minutes risk-ordered.",s:"A finding-count comparison and a note on what linear surfaced that risk-ordered missed."},
  {id:"L5.2",t:"Comprehension audit",h:"2 h",d:"Rate your comprehension 0–3 of every module you shipped in 90 days without opening files. Then check three low scorers.",s:"Audit table, calibration check, one repaid module."},
  {id:"L5.3",t:"Dual review",h:"2 h",d:"Build an agent reviewer with an explicit checklist from your risk order and past incidents. Run on ten PRs alongside your own review.",s:"A confusion table (agent-only / human-only / both / false positive) and a revised checklist."},
  {id:"L5.4",t:"The upstream experiment",h:"2 h",d:"Spend one change's entire review budget on the plan and none on the diff. Spend a comparable change's entirely on the diff.",s:"A written comparison including an honest statement of which you trust and why."}],
 ev:"Review-method comparison, comprehension audit with one repayment, a tuned reviewer with a confusion table, the upstream experiment.",
 fails:["Rubber-stamping large diffs","Reading linearly","Same-context self-review","Treating tidy code as correct code","Never measuring read ratio"],
 read:"Horthy, ACE-FCA (review-the-plan) · Osmani on comprehension debt · DORA 2026 · DHH on code aesthetics"},

M6:{t:"Context Engineering",st:2,pre:"M2",hrs:"8–10 h",
 star:"Context is a budget, not a bucket. Something must be evicted; decide what, deliberately, rather than letting the harness decide by truncation.",
 why:"Horthy states the premise as sharply as it can be stated: the contents of your context window are the only lever you have on output quality. As an operating assumption for a practitioner that is almost exactly right, because context is the lever you actually control. Context engineering is not 'write a good CLAUDE.md' — it is treating the window as a budgeted resource with a lifecycle.",
 out:["Budget a context window and measure its actual composition","Choose correctly between always-on memory, on-demand skills, path-scoped rules and isolated subagents","Diagnose context rot from behaviour and fix it structurally"],
 key:["<b>Context rot symptoms, in order of appearance:</b> stops following conventions → re-reads files → re-proposes rejected approaches → contradicts earlier decisions → becomes <i>confidently</i> wrong about the codebase. Recognising these as context symptoms rather than model symptoms is the diagnostic skill.","<b>The 40–60% rule.</b> Design the workflow to keep utilization in that band. The band matters less than the principle: never let the harness's emergency compaction be your compaction strategy.","<b>Intentional compaction</b> writes a structured artifact <i>to a file</i>: end goal, approach, steps completed, current blocker, critical paths and dependencies. Compact away search transcripts, code-flow exploration, build logs. Never lose decisions with rationale, rejected approaches <i>with reasons</i>, exact paths, acceptance criteria, and the failure state verbatim.","<b>Priority: correctness > completeness > size.</b> Size is last. A lean context full of subtly stale information is worse than a fat accurate one — and this ordering is regularly inverted by people optimizing token spend.","<b>Placement.</b> Always-on memory taxes every request forever; keep it small (~under 200 lines) and audit by asking 'did this matter in the last ten sessions?'. Note the tension with Steinberger's ~800-line agent file — the principle is not a line count, it is that always-on content must earn its place on every request.","<b>Subagents are context firewalls.</b> The reason to spawn one is a task that burns 50k tokens of searching to produce a 500-token answer. Design the <i>return</i> to look like a compaction artifact.","<b>Context minimalism</b> is the live counter-current, and it is model-dependent — which makes it a thing to re-test on every upgrade (M14), not a thing to believe."],
 labs:[
  {id:"L6.1",t:"Context census",h:"1.5 h",d:"Inspect what is actually in your window at startup: memory files, skill descriptions, tool definitions, system prompt.",s:"A token breakdown with a total, plus one item you removed as a result."},
  {id:"L6.2",t:"The always-on audit",h:"2 h",d:"Section by section, find evidence in your last ten sessions that each part mattered. Delete or relocate anything without evidence.",s:"Before/after line and token counts with a relocation map."},
  {id:"L6.3",t:"Intentional compaction",h:"2 h",d:"Stop a long task at ~50% utilization, write the structured artifact, start fresh from it. Repeat a comparable task letting auto-compaction handle it.",s:"Both transcripts, the artifact, and a comparison of what each approach lost."},
  {id:"L6.4",t:"Rot diagnosis",h:"1.5 h",d:"Run a session to near-exhaustion on real work. Log the first appearance of each rot symptom with its utilization percentage.",s:"A symptom timeline and a personal early-warning threshold you will act on."},
  {id:"L6.5",t:"Firewall a subagent",h:"2 h",d:"Run a high-volume research task in the main context, measure tokens; then via an isolated subagent with a specified return format.",s:"Token comparison plus the return-format spec you converged on."}],
 ev:"Census with a deletion, before/after audit, a compaction artifact with comparison, a rot threshold, a subagent return spec.",
 fails:["Treating the memory file as documentation","Optimizing size before correctness","Letting auto-compaction be the strategy","Leaving every MCP server connected permanently","Copying someone else's memory file wholesale"],
 read:"Anthropic, Effective context engineering · Horthy, ACE-FCA · Ronacher on MCP tool bloat"},

M7:{t:"Research → Plan → Implement",st:2,pre:"M6, M5",hrs:"8–10 h",
 star:"Front-load the expensive thinking into reviewable artifacts. Review the research and the plan; let the implementation be mechanical.",
 why:"The most transferable process innovation in the field, with the best-documented outcomes: Horthy's team reports fixing a bug in a 300k-line Rust codebase in one session, and shipping ~35k lines of cancellation and WASM support in about seven hours — roughly three of research and planning, four of implementation — passing expert maintainer review. The leverage argument is the whole argument: a bad line of research becomes a bad plan becomes thousands of bad lines of code.",
 out:["Run the three-phase workflow on a real change in an unfamiliar codebase","Write research and plan artifacts that are reviewable and durable","Know when spec-driven approaches help and when they are ceremony"],
 key:["<b>Research (no edits permitted).</b> Output: a written document with exact file paths and line references, information flow, candidate causes, constraints, open questions. Your review question: <i>is this an accurate map of reality?</i> Spot-check three claims. If research is wrong, stop — everything downstream is poisoned.","<b>Plan (still no edits).</b> Which files change, what the edit is, and how each phase is verified. Your review question: <i>if a competent stranger executed this literally, would the result be right?</i> This is where your scarce attention buys the most.","<b>Implement</b> phase by phase, verifying after each, compacting between. A crashed session resumes from the plan document, not from memory.","The artifacts are <i>files</i>, not chat: durable across crashes, reviewable by humans and agents, reusable for the next similar change, and the honest record of intent when the incident review happens in four months.","The 3:4 research-to-implementation ratio is a starting point for substantial work in unfamiliar code and absurd for a two-line fix. Too little planning yields confident wrong direction; too much yields plans nobody reads, which is ceremony that feels like rigour.","The method <i>amplifies</i> insufficient research rather than rescuing it — Horthy publishes a failure where nested dependencies went unmapped. It is also a poor fit for genuinely exploratory work."],
 labs:[
  {id:"L7.1",t:"Research a stranger's codebase",h:"2 h",d:"A real open-source project you've never worked in, a real open issue, a research-only phase with no edit permission.",s:"A research doc with ≥2 of 3 spot-checks accurate, and any inaccuracy diagnosed."},
  {id:"L7.2",t:"Plan review drill",h:"2 h",d:"Generate a plan from that research. Write every objection before implementing. Then check which were real.",s:"An objection list with hit rate and a note on which classes you predict well and badly."},
  {id:"L7.3",t:"Ratio experiment",h:"3 h",d:"Two comparable tasks: one with ~40% of effort in research and planning, one brief-and-go.",s:"A logged comparison with an honest verdict, including the case where planning lost."},
  {id:"L7.4",t:"Plan reuse",h:"1.5 h",d:"Use a completed plan as the template for a similar change.",s:"A derived plan, a time comparison, and a statement of what generalizes."},
  {id:"L7.5",t:"Spec-driven trial",h:"2 h (optional)",d:"Run one feature through a spec-driven toolkit end to end.",s:"A completed feature and a one-page verdict with a rule for when you'd use it again."}],
 ev:"A verified research document on unfamiliar code, a plan with a scored objection list, the ratio experiment, a reused plan.",
 fails:["Letting the agent edit during research — it starts justifying its edits","Accepting research without spot-checking","Vague plans","Planning two-line changes","Keeping plans in chat where they die with the session"],
 read:"Horthy, ACE-FCA · Horthy's context-engineering talk · Spec-driven toolkits · Grove, The New Code"},

M8:{t:"Designing Codebases for Agents",st:2,pre:"M4",hrs:"10–14 h",
 star:"Agent-legibility is a codebase property you can measure and improve, and it pays off for humans too.",
 why:"Most advice treats the codebase as fixed and compensates with prompting. That is backwards for anything you maintain. Ronacher's observation: agents like local reasoning and have little spatial awareness of the codebase. Everything agent-hostile is a form of <i>non-local reasoning</i>. DHH arriving at the same conclusion from a different direction is the strongest evidence it is real: Rails is token-efficient for agents because its conventions are already in the model's weights, and its integrated testing lets agents self-validate. Convention over configuration turns out to be a machine-readable interface.",
 out:["Audit a codebase for agent-legibility and rank fixes by cost/benefit","Execute high-leverage legibility improvements using agents themselves","Argue the tradeoffs where legibility conflicts with other goods"],
 key:["<b>What agents want:</b> explicit types over inference · greppability (every use site names its origin) · explicit dependencies · braces over significant whitespace · result types over exceptions · boring conventional structure the model has seen a million times.","<b>What agents hate:</b> macros and codegen · barrel files and re-export chains · import aliasing · <b>flaky tests</b> (worse than no suite — they teach the agent that failures are noise) · environment divergence · multi-step tooling with many failure modes.","<b>The ten-check legibility audit:</b> grep finds definitions · one-command build · deterministic suite twice in a row · a &lt;15s feedback command · discoverable module boundaries · no dead code · no drifting duplication · conventions in the code not in someone's head · subsystems understandable from their own directory · error messages that say what to do next.","<b>Refactoring as a standing budget.</b> Steinberger allocates ~20% of time to refactoring performed entirely by agents. It is the most agent-appropriate work there is: mechanical, verifiable, high-volume, low-judgment.","Honest tradeoffs: explicitness costs concision; rewriting a working system for legibility is a bad trade; choosing a language for agent-friendliness is a real strategy and a bet on a fast-moving target.","Legibility work should show up in your M1 numbers. If it doesn't, you improved your aesthetics, not your legibility."],
 labs:[
  {id:"L8.1",t:"Legibility audit",h:"2 h",d:"Score your primary repo on all ten checks with evidence per score. Rank fixes by (impact × frequency) ÷ cost.",s:"A scored audit with a ranked, costed remediation list."},
  {id:"L8.2",t:"Automated hygiene sweep",h:"3 h",d:"Run dead-code and duplicate detection. Have agents remove and consolidate in small verified commits.",s:"Merged cleanup, all tests green, a before/after metric."},
  {id:"L8.3",t:"Kill the flakes",h:"3 h",d:"Run the suite ten times to identify flakes. Fix or quarantine every one.",s:"Ten consecutive identical runs plus a written quarantine policy."},
  {id:"L8.4",t:"Greppability repair",h:"2 h",d:"Remove your worst indirection — a barrel file, a re-export chain, string-keyed dispatch. Measure agent file-finding on three tasks before and after.",s:"Before/after with a measured difference — or an honest null result."},
  {id:"L8.5",t:"Convention extraction",h:"2 h",d:"Have an agent infer your implicit conventions from the code. What it gets right is legible; what it gets wrong is folklore.",s:"An inferred list, corrected, with ≥2 conventions encoded as enforceable checks."}],
 ev:"Scored audit with remediation, a merged hygiene sweep, a deterministic suite, one greppability repair with measurement, ≥2 enforced conventions.",
 fails:["Rewriting working code for aesthetics","Treating agent-legibility as the only goal","Putting conventions in the memory file instead of enforcing them in lint","Leaving flaky tests because 'everyone knows which ones are flaky' — the agent doesn't"],
 read:"Ronacher, A Language For Agents · Ronacher, Agentic Coding Recommendations · DHH on Rails and token efficiency"},

M9:{t:"The Extension Surface",st:2,pre:"M6",hrs:"6–8 h",
 star:"Match the mechanism to the requirement: guarantees go in hooks, knowledge goes in skills, always-true rules go in memory, volume goes in subagents.",
 why:"Modern harnesses expose memory files (e.g. CLAUDE.md or AGENTS.md), path-scoped rules, skills, subagents, hooks, MCP servers and plugins. Used well, this converts your repeated corrections into permanent behaviour. Used badly it becomes a pile of half-remembered configuration that bloats context and produces mysterious behaviour. The organizing distinction is short and constantly violated: <b>an instruction is a request; a hook is a guarantee.</b>",
 out:["Choose the right mechanism for a given need and justify it","Build a personal extension kit that earns its context cost","Evaluate MCP servers on cost/benefit rather than novelty"],
 key:["<b>Add on trigger, not in advance.</b> Wrong twice → memory file. Same prompt repeatedly → skill. Same playbook a third time → skill. A side task floods your conversation → subagent. Must happen without asking → hook. A second repo needs it → plugin.","<b>Hooks are the under-used mechanism.</b> Format after edit · run the fast lane and feed failures back · block edits to secrets, migrations, vendored dirs · log sessions for telemetry · <b>refuse test-file modification during implementation-only tasks</b> (M4's anti-gaming guardrail as enforcement rather than request).","<b>Subagents: design the return.</b> Their value is the compression ratio between what they read and what they return. Unspecified returns give you either a transcript or a vague summary.","<b>MCP, honestly.</b> Use it when the integration needs live connection, authentication, or actions a CLI cannot provide. Use a CLI when the model already knows the tool. Measure the context cost either way and disconnect what this task doesn't need.","<b>The anti-pattern is the configuration cargo cult.</b> Every item in your kit should trace to a specific failure you personally experienced."],
 labs:[
  {id:"L9.1",t:"Correction mining",h:"2 h",d:"List every correction across your last 20 sessions. Cluster them. Choose the right mechanism per cluster; implement the top three.",s:"A correction taxonomy plus three extensions, each traced to specific incidents."},
  {id:"L9.2",t:"Build a guardrail hook",h:"2 h",d:"A blocking hook for something that must never happen. Verify by trying to make the agent do it.",s:"A demonstrated block, plus a note on what the agent did when blocked — this is informative."},
  {id:"L9.3",t:"Build a review subagent",h:"2 h",d:"A specialized reviewer with its own instructions and a specified return format. Run on five PRs; tune on misses.",s:"Subagent definition, five reports, one documented tuning iteration."},
  {id:"L9.4",t:"MCP cost/benefit",h:"1.5 h",d:"Measure the context cost of each connected server. Try replacing the most expensive with CLI calls.",s:"A cost table and one justified connect/disconnect/replace decision."}],
 ev:"A correction taxonomy with three traced extensions, a working blocking hook, a tuned review subagent, an MCP cost table with a decision.",
 fails:["Copying someone else's kit","Building extensions before having the triggers","Instructions where enforcement is required","Skills with vague descriptions that never trigger, or trigger wrongly"],
 read:"Harness extensibility docs · mechanism-selection guidance · Ronacher on MCP"},

M10:{t:"Parallelism",st:3,pre:"M4, M5 (Gate 1)",hrs:"8–10 h",
 star:"Parallelism moves the bottleneck from generation to your attention. If you cannot review and integrate N streams, running N agents produces a queue, not throughput.",
 why:"Cherny calls git worktrees the single biggest productivity unlock and runs five or more sessions concurrently. Steinberger runs 3–8 agents in a terminal grid — in the <i>same folder</i>, avoiding worktrees for speed, with atomic commits. Two expert practitioners, one at the tool's origin, with directly contradictory isolation strategies. They are optimizing different things: worktrees optimize isolation and cost setup; same-folder optimizes latency and shared state and costs collision risk.",
 out:["Choose an isolation strategy per situation and justify it","Run 3+ concurrent agents without becoming the bottleneck or the merge conflict","Recognise when parallelism is negative-value"],
 key:["<b>The isolation spectrum:</b> same folder (no isolation, zero setup, tight supervision) → branches → worktrees (filesystem isolation, per-tree rebuild cost) → containers (full isolation, slowest feedback) → cloud sessions (off-machine, weakest observability).","<b>Good parallel tasks are independent in the file dimension <i>and</i> the review dimension.</b> Three features in three subsystems parallelize. Three refactors of one module do not.","<b>Most people's ceiling is 3–5 concurrent streams, set by review capacity</b> — not by tooling or quota.","Negative-value cases: exploratory work where each step informs the next; same-file tasks; anything you lack review budget for. <b>A parallel agent with no verifier is just a faster way to generate unreviewed code.</b>","Ergonomics are the difference between 3 agents and 6: named sessions, colour-coded terminals, one-key switching, a control-plane view, completion notifications. Without these you spend your attention <i>finding</i> the agent that needs you.","<b>Redundant parallelism</b> — the same task three times with different framings, then pick or synthesize — is under-used and unusually effective on design problems where you recognise a good answer but cannot specify the criterion."],
 labs:[
  {id:"L10.1",t:"Isolation bake-off",h:"3 h",d:"The same three-task batch run three ways: same-folder, worktrees, containers.",s:"A comparison of setup time, collisions, wall-clock to all-merged, and a written per-situation policy."},
  {id:"L10.2",t:"Find your ceiling",h:"3 h",d:"Run 2, 3, 5, then 7 concurrent agents on independent tasks. Track tasks merged per hour and rework passes.",s:"A throughput curve with your stated ceiling and the constraint that sets it."},
  {id:"L10.3",t:"Decomposition drill",h:"2 h",d:"Decompose one large feature into ≥4 parallelizable units with explicit file-level independence. Execute.",s:"The decomposition, the merge outcome, and a note on what collided anyway."},
  {id:"L10.4",t:"Build the control plane",h:"2 h",d:"Session naming, colours, switching, completion notification.",s:"A documented setup you can start in under a minute, plus a before/after switching-time measurement."}],
 ev:"Isolation comparison with a policy, a throughput curve with a stated ceiling, an executed decomposition, a working control plane.",
 fails:["Parallelizing coupled work","Running more agents than you can review","No isolation on destructive tasks","Losing the gains to context switching"],
 read:"Cherny on worktrees · Steinberger on same-folder parallelism · git worktree docs"},

M11:{t:"Loop Engineering",st:3,pre:"M10, M4, M13",hrs:"10–14 h",kw:"frontier",
 star:"A loop is only as good as its fitness function and its stop condition. Build those first; the loop itself is ten lines.",
 why:"Karpathy states the objective plainly: remove yourself as the bottleneck, arrange things so they are completely autonomous. His AutoResearch experiments found hyperparameter improvements overnight that he had missed across two decades of manual tuning. Note the precondition hiding in the framing — <i>arrange it so that it can just go forever</i> — which requires an objective, automatable criterion of success. Where that exists, autonomy is available. Where it does not, autonomy produces confident garbage at scale.",
 out:["Design, run and terminate an autonomous loop on real work","Match loop patterns to task types and recognise anti-fits","Build guardrails, state management and observability for unattended runs"],
 key:["<b>The canonical minimal loop</b> (Huntley's 'Ralph'): a shell loop feeding a specification file to a fresh agent context, repeatedly. The insight is not the bash — it is that <b>fresh contexts working from a persistent specification beat one long context working from memory.</b>","<b>Five components</b> (Osmani): trigger · isolation · knowledge · connection · <b>verification by a separate agent</b>. Plus persistent state on disk, because the model forgets everything between runs. The loop's memory is the filesystem.","<b>Design the stop condition first.</b> Every loop needs at least two — a success condition and a failure/budget condition — or you are relying on noticing.","<b>Overbaking.</b> Loops run past their useful life invent work: unrequested features, speculative abstractions, in one recorded case unexpected cryptography. An agent with remaining budget and no remaining work will <i>invent</i> work. Budget caps are a correctness measure, not a cost measure.","<b>Patterns and fits:</b> spec loop (greenfield from a strong spec; not exploration) · checklist loop (migrations, sweeps) · triage loop (scheduled scan-and-escalate) · verify-and-fix (flaky tests, lint, type migration) · fan-out/verify (audits, large refactors) · optimizer loop (anything with a real metric — beware proxies you will goodhart).","<b>Spec quality is the whole game.</b> A mediocre spec run 200 times produces 200 iterations of mediocrity, quickly and expensively.","Karpathy's caution kept in view: agents are jagged — strong on verifiable metric-driven tasks, weak on nuance, intent, and knowing when to ask a clarifying question. Loop engineering works in the verifiable half. Applying it to the other half is the central error of the era."],
 labs:[
  {id:"L11.1",t:"Minimal loop",h:"2 h",d:"The simplest possible loop in a sandboxed repo: spec file, fresh context each iteration, disk state, hard iteration cap.",s:"A loop that completes a real task and stops on its own condition, with a log."},
  {id:"L11.2",t:"Stop-condition design",h:"2 h",d:"For three task types, implement a success predicate, a no-progress detector, and a budget cap. Test each by making it fire.",s:"Three loops, each demonstrated stopping for each of the three reasons."},
  {id:"L11.3",t:"Induce overbaking",h:"1.5 h",d:"Deliberately run a loop past its useful life on an under-specified task.",s:"A written account of what it invented, and the guardrail that would have prevented it."},
  {id:"L11.4",t:"Verified loop",h:"3 h",d:"Fan-out/verify: worker agents produce, a separate verifier with different instructions checks, failures return to the queue.",s:"A run where the verifier caught ≥1 real defect the worker missed, with the evidence."},
  {id:"L11.5",t:"Scheduled triage loop",h:"3 h",d:"A loop on a schedule against something real — dependency updates, issue triage, failing-test sweep — with escalation for what it shouldn't decide. Run a week.",s:"Seven days of logs, what it handled vs escalated, and a written correctness assessment."}],
 ev:"A terminating loop with a log, three demonstrated stop conditions, an overbaking account, a verified fan-out with a caught defect, a week of scheduled-loop logs.",
 fails:["Running loops before M13","No budget cap","No persistent state, so the loop re-derives everything","Model grading its own work","Looping exploratory work","Spec quality unexamined","No rollback test"],
 read:"A Brief History of Ralph · Osmani, Loop Engineering · Karpathy on autonomy and AutoResearch"},

M12:{t:"Async, Remote & Cloud Agents",st:3,pre:"M11",hrs:"5–7 h",
 star:"Async multiplies production and does nothing for review. Design the review path before you turn on the production path.",
 why:"Once loops run without you, where they run and how you supervise them becomes the practical question. The concepts are inherited from M10 and M11; what is new is a genuine failure mode. Async agents generate work asynchronously; your review capacity does not scale. A dozen agent PRs waiting on Monday morning is not leverage.",
 out:["Choose local vs cloud vs CI execution per task","Supervise unattended work from low-bandwidth contexts","Design a review path that does not become a queue"],
 key:["<b>Where to run:</b> local (fastest feedback, full observability, your machine at risk) · cloud session (survives your laptop closing, weaker observability, credentials get serious) · CI-triggered (reproducible, auditable, and <b>the highest-risk surface for prompt injection</b> — see M13's CVE).","<b>The handoff pattern:</b> high-bandwidth interaction to brief, plan and verify approach → async execution → return for review. The expensive human minutes are at the start and end.","<b>Low-bandwidth supervision.</b> From a phone you can approve a plan, answer a blocking question, kill a run, or read a summary. You cannot review a 2,000-line diff. Design agents to <i>ask well</i> — a blocking question with three options beats an open one.","<b>Managing the review queue:</b> rate-limit production to review capacity · require self-review by a separate verifier before queueing · batch review into blocks · auto-merge classified low-risk categories on policy · escalate only what policy cannot classify. <b>Decide what does not need your eyes explicitly, rather than by neglect.</b>","Credentials: scoped short-lived tokens, no production credentials, egress restrictions, separate identities per agent, an audit log."],
 labs:[
  {id:"L12.1",t:"Handoff",h:"1.5 h",d:"One task through the full pattern: interactive brief and plan → async execution → return for review. Time each phase.",s:"A phase breakdown with the fraction of wall-clock requiring you."},
  {id:"L12.2",t:"Phone drill",h:"1.5 h",d:"Supervise one real async run entirely from a phone.",s:"A friction list and ≥2 changes to how the agent reports or asks."},
  {id:"L12.3",t:"Review-path design",h:"2 h",d:"Write a policy classifying output into auto-merge / fast review / full review. Apply it retrospectively to twenty recent agent changes.",s:"A written policy with its misclassification rate and a revision."},
  {id:"L12.4",t:"CI agent, safely",h:"2 h",d:"An agent triggered by a repository event with least-privilege credentials, egress restrictions, and no write access to what it evaluates.",s:"A working CI agent plus a threat model naming untrusted inputs and what it could exfiltrate if compromised."}],
 ev:"A timed handoff breakdown, a phone friction list with fixes, a validated review policy, a CI agent with a written threat model.",
 fails:["Turning on async production without a review path","Production credentials in cloud agents","Agents that ask open-ended questions you cannot answer from a phone","Treating CI agents as trusted"],
 read:"Harness docs on remote sessions and scheduling · the CVE-2025-66032 case study"},

M13:{t:"Security & Safety for Agentic Development",st:3,pre:"M9",hrs:"8–10 h",kw:"gate",
 star:"An agent cannot reliably distinguish data from instructions. Architect on that assumption; do not prompt your way around it.",
 why:"Willison's <b>lethal trifecta</b> names the condition precisely: an agent with access to private data, exposure to untrusted content, and the ability to communicate externally can be made to exfiltrate. All three together are the vulnerability; any two are safe. Almost every agentic coding setup has all three by default.<br><br>The concrete case is <b>CVE-2025-66032</b>: an authorization check in a widely-used coding-agent GitHub Action trusted any GitHub App actor. An attacker filed a crafted issue on a public repo; injected instructions read the workflow environment, extracted an OIDC token, exchanged it for write access, and committed to the action's own source — poisoning every downstream consumer. <b>Nothing in that chain required a model failure.</b> Every step was the agent doing exactly what it was told by text it had no way to distinguish from your instructions.",
 out:["Apply the lethal-trifecta test to any agent configuration","Design permission, sandboxing and egress controls proportional to autonomy","Threat-model an agentic workflow and defend the supply chain"],
 key:["<b>Indirect prompt injection</b> is the dangerous class: instructions arriving in content the agent <i>reads</i> — an issue, a dependency's README, a web page, a code comment, an error message, a log line, a tool result. There is no reliable in-band separation of instructions from data. Mitigation is architectural, never prompt-level.","<b>The trifecta test:</b> private data? untrusted content? external communication? If all three, break one — no credentials in that session, human-sanitized inputs, or a network allowlist with no push and no arbitrary HTTP.","<b>Isolation must rise with autonomy, not with your comfort level.</b> Supervised on host → auto-approved safe commands with a permission policy → bounded unattended in a container with an allowlist → unattended loop in a disposable container with per-agent identity → CI on untrusted input with no repo write and no credentials.","Blanket permission-skipping is the common shortcut and the common cause. Prompt fatigue is a configuration problem: allowlist provably-safe operations and sandbox, so prompts are rare <i>because most actions are provably safe</i>.","<b>Supply chain, both directions.</b> Inbound: agents have been documented skipping package verification. Require lockfiles, pin actions to commit SHAs, make 'new dependency' a mandatory review category. Outbound: an agent with write access is a commit path into your users' systems.","Secrets never enter context, memory files, or an environment an unattended agent can read. Assume anything readable will eventually be read aloud — that is exactly the CVE chain.","An MCP server is code you run <i>and</i> a channel through which attacker-controllable text enters your context. Treat installing one as installing a dependency with your credentials attached.","2026 security research notes these vulnerabilities fall between vendors, platform teams and application teams with no clear owner. <b>If you are introducing agents into a team's CI, you are the owner until you name someone else.</b>"],
 labs:[
  {id:"L13.1",t:"Trifecta audit",h:"2 h",d:"Enumerate every agent configuration you run — local, CI, cloud, scheduled. Mark the three conditions for each.",s:"An audit table with a remediation for every all-three case."},
  {id:"L13.2",t:"Attack your own agent",h:"2.5 h",d:"In a sandbox with a fake credential, plant injection payloads in a README, a code comment, a test fixture, a mock issue body, a tool result.",s:"A results table of which vectors worked, plus a written defence for each success."},
  {id:"L13.3",t:"Build the sandbox",h:"2 h",d:"A containerized environment for unattended runs: no host credentials, egress allowlist, mounted work directory only, disposable.",s:"A working sandbox with a verified test that egress to a non-allowlisted host fails."},
  {id:"L13.4",t:"Threat model a workflow",h:"2 h",d:"Your riskiest agentic workflow: trust boundaries, untrusted inputs, what an attacker gains, what would detect it.",s:"A written threat model and one implemented mitigation."},
  {id:"L13.5",t:"Supply-chain guardrail",h:"1.5 h",d:"Enforcement that flags any agent-added dependency for human review; pin CI actions to SHAs.",s:"A demonstrated flag on a test dependency addition; pinned actions merged."}],
 ev:"A trifecta audit with remediations, a red-team results table, a verified sandbox, a threat model with a fix, a working supply-chain guardrail.",
 fails:["Blanket permission-skipping as the default","Treating prompt injection as solvable by instructions","Production credentials in unattended runs","Trusting MCP servers as configuration rather than dependencies","Assuming the vendor handles it"],
 read:"Willison, The lethal trifecta · CSA research note on CVE-2025-66032 · 2026 agentic security state of practice"},

M14:{t:"Evals for Your Own Work",st:4,pre:"M7, M8 (Gate 2)",hrs:"8–10 h",
 star:"If you cannot measure whether a change to your setup helped, you are not engineering your workflow — you are decorating it.",
 why:"You will face this every few weeks for the rest of your career: a new model ships, or you change your prompt, memory file, or workflow. Did it help? Public benchmarks cannot answer this — different task distribution, different codebase, different harness, and harness choice alone moves scores by double digits on the same base model. An eval suite of your own is unglamorous, takes a weekend, and is the highest-leverage thing in Phase 5.",
 out:["Build a personal eval suite of golden tasks from your own work","Run a controlled comparison of models, prompts or workflows","Read public benchmarks correctly: what they do and do not tell you"],
 key:["<b>Golden tasks:</b> 10–20 from your own history, each with a starting commit, the brief as you'd write it, an automated check where possible. Span trivial to hard, and include <b>at least two you know models currently fail</b> — those are the most informative entries, because that is where a new model's improvement first shows up.","<b>Control for variance.</b> Agent runs are stochastic. Run each task 3–5 times and compare distributions, not anecdotes. Most excited claims about a new model are within noise.","<b>Eval your own changes, not just models.</b> Memory file edits, context minimalism vs pre-loading, plan-first vs direct, subagent return formats, verifier strength — the knobs you turn weekly and currently turn blind.","Where judgment is needed, use a rubric applied by a <i>different</i> model family than the one under test, and spot-check its judgments — LLM-as-judge is useful and quietly biased toward its own family's style.","Run the suite monthly as an early-warning system for silent degradation. Models change under you, including within a version."],
 labs:[
  {id:"L14.1",t:"Build the suite",h:"4 h",d:"10+ golden tasks from your history with starting commits and success criteria, including ≥2 known failures.",s:"A runnable suite, executable with one command, producing a score."},
  {id:"L14.2",t:"Variance study",h:"2 h",d:"Five tasks, five runs each, one model. Compute the spread.",s:"A variance table and a stated minimum effect size you will believe."},
  {id:"L14.3",t:"A controlled comparison",h:"2 h",d:"Two models, or two of your own configurations, everything else held constant.",s:"A conclusion that respects your minimum effect size — including 'no detectable difference', a real and common result."},
  {id:"L14.4",t:"Eval your memory file",h:"2 h",d:"Run the suite with your memory file, without it, and with the trimmed version from L6.2.",s:"Three scores and a decision about what actually earns its context."}],
 ev:"A runnable suite with ≥10 tasks, a variance table with a minimum effect size, one controlled comparison, a memory-file eval that changed a decision.",
 fails:["Benchmarks instead of your own tasks","Single runs","Changing two things at once","Building 50 tasks and never running them","No known-failure tasks, so improvements are invisible"],
 read:"Benchmark landscape and critiques · eval tooling"},

M15:{t:"Building Harnesses & Agent Systems",st:4,pre:"M2, M6",hrs:"10–14 h",
 star:"Build agents for the workflows only you have. Buy the general harness.",
 why:"M2 built a toy. This takes it to where you could use it — and, more importantly, where you can reason about any harness's design decisions and build purpose-specific agents for your own workflows. The most valuable agents you run are often the small specific ones nobody will build for you: a release-note writer that knows your conventions, an incident triager wired to your logs, a migration agent for your particular framework version. Keep Steinberger's caution in view: specialized harnesses will likely converge toward model capabilities, so build features to solve today's problem, not as a durable moat.",
 out:["Extend a hand-built agent with compaction, subagents, permissions and persistence","Design tools and their results for context efficiency","Decide build-vs-extend-vs-buy deliberately"],
 key:["<b>Tool result design matters more than call design.</b> Return the minimum supporting the next decision · actionable errors, not terminal ones · explicit truncation markers with a way to get more · one flexible tool over twelve narrow ones · side-effecting tools distinguishable from read-only so permissions can be mechanical.","<b>Compaction, implemented.</b> Trigger at a threshold you set. Preserve goal, approach, completed steps, current failure state, critical paths, rejected approaches with reasons. Write it to disk so it survives the process.","<b>Subagent architecture:</b> what context does the child start with, what does it return in what shape, can it spawn children, how do failures propagate. The compression ratio — tokens read ÷ tokens returned — tells you whether it earns its overhead.","<b>Persistence and resumption</b> separate a demo from something you would let run overnight: session state on disk, resume from a state file, idempotent operations so a resumed run doesn't double-apply.","<b>Build vs extend vs buy.</b> Extend when your harness has the seam — right about 80% of the time. Build when you need an agent inside your own product, an unusual loop shape, or full control of context. Buy the general coding harness; you will not out-engineer a funded team on the common path."],
 labs:[
  {id:"L15.1",t:"Production-ish agent",h:"5 h",d:"Extend your M2 agent with threshold compaction to disk, a subagent tool with a specified return format, a permission allowlist, and resumable session state.",s:"It completes a multi-hour task across a compaction boundary and survives a restart."},
  {id:"L15.2",t:"Tool result design",h:"2 h",d:"Log tokens per tool result. Find the worst offender and redesign it.",s:"A before/after token profile with a measured reduction and no loss of capability."},
  {id:"L15.3",t:"Build a workflow agent",h:"3 h",d:"One small specific agent for a real recurring task of yours. Use it for a week.",s:"The agent, a week of usage notes, and an honest keep/kill decision."},
  {id:"L15.4",t:"Orchestration comparison",h:"2 h",d:"Implement the same non-trivial task as a sequential pipeline and as fan-out/verify.",s:"A comparison with a stated rule for which to use when."}],
 ev:"An extended agent surviving compaction and restart, a tool-result token improvement, one workflow agent with a keep/kill decision, an orchestration comparison.",
 fails:["Rebuilding a commercial harness","Too many narrow tools","Compaction that loses the failure state","Subagents with unspecified returns","No persistence, so nothing can run long"],
 read:"Ball · agent SDK documentation · Anthropic context engineering · orchestration patterns"},

M16:{t:"Teams, Orgs & Comprehension Debt",st:4,pre:"M13, M14 (Gate 3)",hrs:"6–8 h",
 star:"The bottleneck moves to review, integration and understanding. Plan for the bottleneck you are creating.",
 why:"Individual mastery does not survive contact with a team that has none. DORA's 2026 analysis says three things worth internalizing: <b>AI amplifies the existing system</b> (strong organizations get stronger, dysfunctional ones get more dysfunctional, faster); there is a <b>J-curve</b> — an initial dip that is the tuition cost of transformation, during which teams conclude the tools don't work; and there is an <b>instability tax</b> — individual effectiveness rises while delivery stability falls. Gains are also strongly task-dependent: substantial on simple work, markedly smaller on complex legacy code. A rollout promising uniform gains fails publicly in exactly the codebases that matter most.",
 out:["Diagnose where agent adoption will bind in a specific team","Design review and quality processes for high-volume agent output","Manage comprehension debt as an explicit organizational liability"],
 key:["<b>Find the new bottleneck</b> and invest there. It is almost always review, then integration, then deployment confidence — not more generation capacity.","<b>Layered review at volume:</b> automated first · human attention on the M5 risk order · policy-based auto-merge for classified low-risk categories · and a hard rule that <b>the author reviews their agent's output before it reaches a colleague</b>. Sending unreviewed agent output to a human reviewer moves your comprehension debt onto someone else's balance sheet, and teams notice.","<b>Comprehension debt at team scale:</b> ownership that means comprehension rather than a CODEOWNERS line · incident-driven repayment · decision records so intent survives when line-level understanding doesn't · plan and research artifacts kept in-repo.","<b>Juniors are the genuine unresolved problem.</b> The traditional apprenticeship ran through exactly the work agents now do. Without deliberately constructed learning paths you will produce engineers who can prompt and cannot debug. State your position explicitly; drifting into a default is how teams get a capability cliff in three years.","<b>Shared assets belong in version control and in review.</b> A team memory file is a living style guide agents actually follow — higher-leverage than a wiki nobody reads. When a reviewer corrects something twice, that correction becomes a rule.","Rollout that survives the J-curve: a willing team, a well-understood codebase, honest measurement <i>including stability</i>, the dip announced in advance, investment in the bottleneck, expansion on evidence."],
 labs:[
  {id:"L16.1",t:"Bottleneck analysis",h:"2 h",d:"Map your team's flow from idea to production. Identify where a 3× generation increase binds; quantify current capacity there.",s:"A flow map with a quantified bottleneck and a proposed intervention."},
  {id:"L16.2",t:"Team memory file",h:"2 h",d:"Create or overhaul a shared, version-controlled memory file derived from real review comments in your repo's history.",s:"A merged file whose every rule traces to ≥2 historical review comments."},
  {id:"L16.3",t:"Review policy",h:"2 h",d:"Draft a team policy for agent-generated code: what must be human-reviewed, what can auto-merge, what the author must do first. Circulate it.",s:"A written policy plus documented colleague feedback and a revision."},
  {id:"L16.4",t:"Debt register",h:"1.5 h",d:"Subsystem, owner, comprehension level, last-read date, risk. Schedule repayment for the top item.",s:"A register with ≥10 entries and one repayment completed."}],
 ev:"A quantified bottleneck analysis, a merged evidence-derived team memory file, a circulated review policy with feedback, a debt register with one repayment.",
 fails:["Rolling out tools without moving the bottleneck","Promising uniform gains","Ignoring stability metrics","No plan for juniors","Memory files that are opinion rather than evidence"],
 read:"DORA 2026 ROI report · DORA 2025 · Fowler/Thoughtworks field observations"},

M17:{t:"Capstone C, Doctrine & Continuous Practice",st:4,pre:"M16",hrs:"20–30 h",
 star:"The deliverable of this course is not a skill set. It is a method for acquiring skill sets faster than they expire.",
 why:"The half-life of specific technique in this field is short. The half-life of judgment is long. This module converts everything you did into two durable things: a doctrine document stating what <i>you</i> believe and why, and a practice that keeps it current after the course ends.",
 out:["Operate an autonomous loop on real work for a week, with an incident log","Write a doctrine document that states positions, mind-changes and remaining weaknesses","Establish a practice that keeps all of it current"],
 key:["<b>The doctrine document</b> (1,500–3,000 words): what I believe now · what I changed my mind about, quoted against your M1 beliefs statement · my verification stack, honestly · my autonomy policy and why · where I disagree with the experts (≥3, argued) · <b>what I am still bad at</b> — the most valuable section and the one people skip · my refresh practice.","<b>Re-run the M1 measurements.</b> Same task types, same log. Report honestly, including regression. Some practitioners get slower at certain task classes while getting much faster overall — a real and useful finding, not a failure.","<b>The continuous practice:</b> monthly eval run · monthly Practitioner Teardown · quarterly context and extension-kit audit · quarterly state-of-play refresh.","<b>Teach it.</b> The strongest evidence of mastery is that someone else got better because of you. If you cannot explain why a technique works in terms of the verification gap, you have not finished learning it."],
 labs:[
  {id:"C.1",t:"Capstone C — operate an autonomous loop for a week",h:"15–20 h",d:"Real work with real consequences. All five loop components plus persistent state. A separate verifier. Hard budget caps, a tested rollback, a kill switch. Sandboxed per M13 with a written threat model. An append-only action log.",s:"Seven days of logs, an incident log, a cost accounting, and a 1,000-word net-value judgment. A Capstone C with an empty incident log fails."},
  {id:"C.2",t:"The doctrine document",h:"4 h",d:"1,500–3,000 words in the seven-section structure. Quote your M1 beliefs statement directly.",s:"≥2 real mind-changes identified, ≥3 argued disagreements with named practitioners, and a specific statement of remaining weaknesses."},
  {id:"C.3",t:"Re-run the baseline",h:"3 h",d:"Repeat the M1 measurements on comparable task types.",s:"An honest before/after comparison including any regression."},
  {id:"C.4",t:"Teach one thing",h:"2 h",d:"Pair with a colleague, write up one technique, or run an internal session.",s:"A teaching artifact, plus evidence someone else changed what they do."}],
 ev:"Capstone C with an incident log, the doctrine document, re-run measurements, a scheduled practice, and one teaching artifact.",
 fails:["An empty incident log","A doctrine document that agrees with everyone","Skipping the 'still bad at' section","Never scheduling the refresh practice"],
 read:"Your own ase/log.md and beliefs statement · the Disagreement Map, revisited"}
};

const PEOPLE = [
 {n:"Peter Steinberger",l:[["Blog","https://steipete.me/"],["X","https://x.com/steipete"],["GitHub","https://github.com/steipete"]],k:"steipete",asof:"Dec 2025; role Feb 2026",d:"Maximum throughput, minimum ceremony",
  b:"Creator of OpenClaw, the open-source personal AI agent that became one of the most-starred projects on GitHub and is now run by an independent foundation; at OpenAI since February 2026, working on agents. Earlier he bootstrapped PSPDFKit. The most relentlessly public documenter of high-volume agentic practice through 2025. Runs 3–8 parallel agents in the same folder with atomic commits, asks for tests in the same context as the implementation, spends ~20% of his time on agent-performed refactoring, and maintains a large agent-updated instructions file.",
  q:"These days I don't read much code anymore. I watch the stream and sometimes look at key parts.",
  c:"His substrate is unusual and largely undisclosed in the headline claims: a codebase he wrote and knows completely, two-minute preview deploys, trivial revert cost, very high token budget, no external review requirement, consumer-product risk. 'I don't read code' is the conclusion of that stack, not a technique you can adopt directly."},
 {n:"Boris Cherny",l:[["X","https://x.com/bcherny"],["Blog","https://borischerny.com/"],["GitHub","https://github.com/bcherny"],["Tips compilation (fan-run)","https://howborisusesclaudecode.com/"]],k:"Boris",asof:"Jun 2026",d:"Delegation, verification, extension",
  b:"Creator and head of Claude Code. Verification above all — he attributes a 2–3× quality difference to giving the agent a way to check itself. Worktrees as the single biggest unlock. Full-context briefs. Rules, not corrections. Rewind rather than argue. Heavy, deliberate use of hooks, subagents and skills. Most of his coding done by voice.",
  q:"Give Claude a way to verify its output — this 2-3x's the quality of results.",
  c:"His advice on plan mode inverted across model generations — first always plan first, later skip it because newer models plan implicitly. That drift is the best illustration in the dossier of why technique is model-dependent and must be re-tested rather than believed."},
 {n:"Andrej Karpathy",l:[["Blog","https://karpathy.bearblog.dev/"],["YouTube","https://www.youtube.com/@AndrejKarpathy"],["X","https://x.com/karpathy"],["GitHub","https://github.com/karpathy"]],k:"Karpathy",asof:"Mar 2026",d:"The conceptual frame, and the honest limits",
  b:"Founding member of OpenAI and former Director of AI at Tesla; his teaching videos and repos are the best route to understanding what sits under the agent. Coined 'vibe coding' in February 2025, and a year later (February 2026) proposed 'agentic engineering' as the name for the professional version: agentic because you mostly are not writing the code yourself, engineering because doing it well is a skill with its own depth. The autonomy slider: calibrate delegation to verifiability, per task. AutoResearch found hyperparameter improvements overnight that he had missed over two decades — because the metric was objective and automatable.",
  q:"Remove yourself as the bottleneck… arrange things such that they're completely autonomous.",
  c:"He works on research code with clean objective metrics — the most favourable possible terrain for autonomy. Most software has no equivalent of validation loss. He is explicit that agents remain jagged on nuance, intent, and knowing when to ask."},
 {n:"David Heinemeier Hansson",l:[["Blog","https://world.hey.com/dhh"],["X","https://x.com/dhh"],["YouTube","https://www.youtube.com/@dhh37"],["Podcast (REWORK)","https://37signals.com/podcast/"]],k:"DHH",asof:"Aug 2026 — revised Sep 17",d:"The documented mind-change, twice",b:"Creator of Rails. Found autocomplete-era assistants genuinely annoying; by January 2026 was writing that agents had crossed a threshold; by April 2026 was reviewing every diff before merge; and by August 2026 reports shipping two months of a real project — Omarchy Quattro — without hand-writing any of the code. He has not stopped reviewing. He has made review risk-tiered: shape everywhere, lines where the risk concentrates, nothing where it does not. Read that against M5 — it is risk-ordered reading, arrived at independently by someone who spent a year resisting the whole idea.",q:"I've reviewed the shape of all of it. I've reviewed the individual lines of anything that critical in the model layer of the system, and I've not looked at a bunch of the UI code.",c:"He works in a mature, conventional, heavily-tested codebase in a framework saturated in training data — close to the best case. Quattro is his own project on his own risk tolerance with no external review requirement. And note the meta-lesson: he has moved twice in eighteen months. A position held firmly can still be wrong, including the current one."},
 {n:"Dex Horthy",l:[["Blog","https://www.humanlayer.dev/blog"],["X","https://x.com/dexhorthy"],["YouTube","https://www.youtube.com/@humanlayerdev"],["GitHub","https://github.com/humanlayer"]],k:"Dex",asof:"Sep 2026",d:"Upstream review and intentional compaction",
  b:"Co-founder and CEO of HumanLayer; author of 12-Factor Agents and ACE-FCA — the most rigorous published methodology in the field. 12-Factor Agents argued that 'everything is context engineering' in spring 2025, about two months before the term caught on. Research → Plan → Implement with reviewable file artifacts, frequent intentional compaction at 40–60% utilization, and review leverage moved upstream. Reports a 300k-line Rust bug fixed in one session and ~35k lines shipped in seven hours, passing maintainer review.",
  q:"A bad line of code is a bad line of code. A bad line of a plan could lead to hundreds of bad lines of code. A bad line of research could land you with thousands.",
  c:"Real overhead, genuinely wrong for small or exploratory work. The headline results involve deep human engagement and codebase expertise that the method amplifies rather than replaces. Results are self-reported — though he also publishes his failures, which raises his credibility."},
 {n:"Kent Beck",l:[["Newsletter","https://newsletter.kentbeck.com/"],["X","https://x.com/KentBeck"],["YouTube","https://www.youtube.com/@kentbeck"],["Site","https://kentbeck.com/"]],asof:"Sep 2026",d:"Tests as the binding constraint",
  b:"Creator of extreme programming and modern TDD. 'Augmented coding' distinguishes caring about code, complexity, tests and coverage from vibe coding's indifference to them. TDD becomes the agent's stop condition: find the next unimplemented test, implement it, write only enough to pass, stop. Watches for loops, unrequested functionality, and tests being disabled.",
  q:"The value system in augmented coding is similar to hand coding — tidy code that works. It's just that I don't type much of that code.",
  c:"TDD has real costs and real critics, and agents worsen some of them — they will happily generate large tautological suites. His own framing is exploratory and he revises it publicly."},
 {n:"Armin Ronacher",l:[["Blog","https://lucumr.pocoo.org/"],["X","https://x.com/mitsuhiko"],["YouTube","https://www.youtube.com/@ArminRonacher"],["GitHub","https://github.com/mitsuhiko"]],k:"mitsuhiko",asof:"Feb 2026",d:"Design the environment, not the prompt",
  b:"Creator of Flask. Agents reason locally, so codebases and languages that support local reasoning get better results — a more durable investment than any prompting technique. Explicit types, greppability, explicit dependencies, braces over whitespace, result types, boring structure. Against macros, barrel files, aliasing, flaky tests and environment divergence.",
  q:"Agents really like local reasoning… they often work with just a few loaded files in context and don't have much spatial awareness of the codebase.",
  c:"Speculating publicly about languages designed for agents — interesting, too early to act on. His preferences are shaped by systems and infrastructure work. He also publishes what didn't work, which is rarer and more useful than it sounds."},
 {n:"Geoffrey Huntley",l:[["Blog","https://ghuntley.com/"],["X","https://x.com/GeoffreyHuntley"],["YouTube","https://www.youtube.com/@GeoffreyHuntley"],["GitHub","https://github.com/ghuntley"]],k:"ghuntley",asof:"Jan 2026",d:"The loop, in its rawest form",

 {n:"Thorsten Ball",l:[["Newsletter","https://registerspill.thorstenball.com/"],["Podcast (Raising an Agent)","https://ampcode.com/podcast"],["X","https://x.com/thorstenball"],["Site","https://thorstenball.com/"]],asof:"Sep 2026",d:"Demystification",
