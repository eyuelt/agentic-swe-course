      - {kind: index, url: "https://www.thoughtworks.com/radar"}

# Non-person sources: evidence and standards. Same pipeline, different triage.
institutions:
  - name: METR
    sources: [{kind: index, url: "https://metr.org/blog"}]
    classify_as_default: evidence
  - name: DORA
    sources: [{kind: index, url: "https://dora.dev/research/publications/"}]
    classify_as_default: evidence
  - name: Your primary harness
    sources: [{kind: index, url: "https://code.claude.com/docs/llms.txt"}]
    classify_as_default: tool-change
    note: "llms.txt is a machine-readable doc index; diffing it surfaces new features cheaply."
